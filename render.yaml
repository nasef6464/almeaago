# ALMEAA GO only. The legacy almeaacodax deployment is intentionally untouched.
# Neon supplies PostgreSQL; do not create a second Postgres database on Render.
# Staging media is explicitly routed to Cloudinary. R2 remains supported in code
# as a fallback/provider option, but this blueprint does not activate it.
services:
  - type: web
    name: almeaago-api
    runtime: go
    region: frankfurt
    plan: free
    repo: https://github.com/nasef6464/almeaago
    branch: main
    autoDeployTrigger: off
    buildCommand: go build -trimpath -o bin/almeaago-api ./cmd/api
    startCommand: ./bin/almeaago-api
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: staging
      - key: HTTP_ADDR
        value: :10000
      - key: DEPLOYMENT_PROVIDER
        value: render
      - key: DATABASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: REDIS_URL
        fromService:
          name: almeaago-redis
          type: keyvalue
          property: connectionString
      - key: CLASSROOM_PIN_SECRET
        generateValue: true
      - key: AUTH_OTP_PEPPER
        generateValue: true

      # Media provider: Cloudinary for ALMEAA Go staging.
      # Credentials are server-only and must never be committed or exposed to Vite.
      - key: MEDIA_STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: MEDIA_MAX_UPLOAD_BYTES
        value: "15728640"

  - type: keyvalue
    name: almeaago-redis
    region: frankfurt
    plan: free
    ipAllowList: []
