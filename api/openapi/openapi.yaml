openapi: 3.1.0
info:
  title: ALMEAA API
  version: 0.3.0
paths:
  /api/v1/taxonomy/bootstrap:
    get:
      operationId: taxonomyPublicBootstrap
      parameters:
        - in: query
          name: phase
          schema: { type: string, enum: [core, compact, full], default: full }
      responses:
        "200": { description: Active normalized taxonomy hierarchy; core omits skills }
        "400": { description: Invalid bootstrap phase }
        "500": { description: Taxonomy unavailable }

  /health/live:
    get:
      operationId: healthLive
      responses:
        "200": { description: Process is alive }
  /health/ready:
    get:
      operationId: healthReady
      responses:
        "200": { description: Core dependencies are reachable }
        "503": { description: Dependency unavailable }

  /api/v1/schools/context:
    get:
      operationId: organizationsSchoolContexts
      responses:
        "200": { description: Canonical active school contexts for the authenticated user }
        "401": { description: Authentication required }

  /api/v1/parents/authority:
    get:
      operationId: organizationsParentAuthority
      description: >
        Canonical Organizations-owned parent-to-student authority projection.
        Returns identifiers and relationship scope only; student profile/progress/reporting
        data remains owned by Identity/Reporting/Learning.
      responses:
        "200": { description: Active canonical parent-to-student relationships }
        "401": { description: Authentication required }
        "403": { description: Parent role required }

  /api/v1/schools/teacher-workspace:
    get:
      operationId: organizationsTeacherWorkspace
      description: >
        Organizations-owned structural workspace for an authenticated school teacher.
        Returns only active school/class/subject assignments and aggregate student counts.
        Entitlements, assessments, realtime state, reporting data, and trainer scope remain
        owned by their respective domains.
      responses:
        "200": { description: Scoped teacher school assignments }
        "401": { description: Authentication required }
        "403": { description: Teacher role required }

  /api/v1/schools:
    get:
      operationId: organizationsListSchools
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: search, schema: { type: string, maxLength: 120 } }
        - { in: query, name: status, schema: { type: string, enum: [active, suspended, archived] } }
      responses:
        "200": { description: Paginated schools visible to the authenticated organization scope }
        "401": { description: Authentication required }
        "403": { description: Organization role or scope denied }
    post:
      operationId: organizationsCreateSchool
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                code: { type: string, maxLength: 64 }
                name: { type: string, minLength: 1, maxLength: 160 }
                metadata: { type: object }
      responses:
        "201": { description: School created }
        "400": { description: Invalid request }
        "401": { description: Authentication required }
        "403": { description: Platform admin role and valid CSRF required }
        "409": { description: School code or normalized school identity conflicts }

  /api/v1/schools/{schoolId}:
    get:
      operationId: organizationsGetSchool
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
      responses:
        "200": { description: School visible to current scope }
        "401": { description: Authentication required }
        "403": { description: School scope denied }
        "404": { description: School not found }
    patch:
      operationId: organizationsUpdateSchool
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 160 }
                status: { type: string, enum: [active, suspended] }
                metadata: { type: object }
      responses:
        "200": { description: School updated }
        "400": { description: Invalid patch }
        "401": { description: Authentication required }
        "403": { description: School-management scope or CSRF denied }
        "404": { description: School not found }
        "409": { description: School update conflicts }
    delete:
      operationId: organizationsArchiveSchool
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "200": { description: School archived; canonical academic/audit records are retained }
        "401": { description: Authentication required }
        "403": { description: School-management scope or CSRF denied }
        "404": { description: School not found }

  /api/v1/schools/{schoolId}/classes:
    get:
      operationId: organizationsListClasses
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: search, schema: { type: string, maxLength: 120 } }
        - { in: query, name: status, schema: { type: string, enum: [active, archived] } }
      responses:
        "200": { description: Paginated classes visible inside the school scope }
        "401": { description: Authentication required }
        "403": { description: School scope denied }
    post:
      operationId: organizationsCreateClass
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                code: { type: string, maxLength: 64 }
                name: { type: string, minLength: 1, maxLength: 160 }
                metadata: { type: object }
      responses:
        "201": { description: Class created }
        "400": { description: Invalid request }
        "401": { description: Authentication required }
        "403": { description: Class-management capability or CSRF denied }
        "409": { description: Class code/name conflicts inside the school }

  /api/v1/schools/{schoolId}/classes/{classId}:
    patch:
      operationId: organizationsUpdateClass
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - { in: path, name: classId, required: true, schema: { type: string } }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 160 }
                status: { type: string, enum: [active] }
                metadata: { type: object }
      responses:
        "200": { description: Class updated }
        "400": { description: Invalid patch }
        "401": { description: Authentication required }
        "403": { description: Class-management capability or CSRF denied }
        "404": { description: Class not found in school }
        "409": { description: Class update conflicts }
    delete:
      operationId: organizationsArchiveClass
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - { in: path, name: classId, required: true, schema: { type: string } }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "200": { description: Class archived; roster/history remain relational records }
        "401": { description: Authentication required }
        "403": { description: Class-management capability or CSRF denied }
        "404": { description: Class not found in school }

  /api/v1/schools/{schoolId}/roster:
    get:
      operationId: organizationsSchoolRoster
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: search, schema: { type: string, maxLength: 120 } }
        - { in: query, name: role, schema: { type: string, enum: [student, teacher, supervisor, school_admin, parent] } }
        - { in: query, name: classId, schema: { type: string } }
        - { in: query, name: isActive, schema: { type: boolean } }
      responses:
        "200": { description: Bounded school roster; teacher and school-director reads are constrained by role/capability policy }
        "400": { description: Invalid filter }
        "401": { description: Authentication required }
        "403": { description: School/role/class scope denied }

  /api/v1/schools/{schoolId}/memberships:
    put:
      operationId: organizationsUpsertMembership
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId, role]
              properties:
                userId: { type: string }
                role: { type: string, enum: [student, teacher, supervisor, parent] }
                status: { type: string, enum: [active, suspended, graduated, revoked], default: active }
      responses:
        "200": { description: School membership created or updated }
        "400": { description: Invalid membership input }
        "401": { description: Authentication required }
        "403": { description: Platform admin role or CSRF denied }
        "404": { description: School/user/role relationship target not found }

  /api/v1/schools/{schoolId}/directors:
    get:
      operationId: organizationsListDirectors
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: status, schema: { type: string, enum: [active, suspended, graduated, revoked] } }
      responses:
        "200": { description: Paginated school director delegations plus supported/default permission catalog }
        "401": { description: Authentication required }
        "403": { description: Platform admin role required }

  /api/v1/schools/{schoolId}/directors/{userId}:
    put:
      operationId: organizationsUpsertDirector
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - { in: path, name: userId, required: true, schema: { type: string } }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status: { type: string, enum: [active, revoked], default: active }
                permissions:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - SCHOOL_OVERVIEW_VIEW
                      - SCHOOL_REPORTS_AGGREGATE_VIEW
                      - SCHOOL_STUDENTS_VIEW
                      - SCHOOL_STUDENTS_ADD
                      - SCHOOL_STUDENTS_MOVE_CLASS
                      - SCHOOL_STUDENTS_UPDATE_BASIC
                      - SCHOOL_STUDENTS_DEACTIVATE
                      - SCHOOL_CLASSES_MANAGE
                      - SCHOOL_TEACHERS_ASSIGN
                      - SCHOOL_REPORTS_DETAILED_VIEW
                      - SCHOOL_REPORTS_EXPORT
                      - SCHOOL_ASSESSMENTS_MANAGE
                      - SCHOOL_SMART_CLASSROOM_VIEW
                      - SCHOOL_INTERVENTIONS_VIEW
                      - SCHOOL_INTERVENTIONS_MANAGE
                      - SCHOOL_STUDENTS_TRANSFER_SCHOOL
              description: Omitting permissions uses the legacy default set; an explicit empty array grants no director permissions.
      responses:
        "200": { description: Director delegation updated transactionally with permissions and audit }
        "400": { description: Invalid status or permission }
        "401": { description: Authentication required }
        "403": { description: Platform admin role or CSRF denied }
        "404": { description: School or school_admin user not found }

  /api/v1/schools/{schoolId}/assignments:
    get:
      operationId: organizationsListTeachingAssignments
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: teacherId, schema: { type: string } }
        - { in: query, name: classId, schema: { type: string } }
        - { in: query, name: subjectId, schema: { type: string, description: Empty value selects subject-agnostic assignments } }
        - { in: query, name: status, schema: { type: string, enum: [active, ended, revoked] } }
      responses:
        "200": { description: Bounded teaching-assignment directory; teachers are forced to their own assignments }
        "400": { description: Invalid filter }
        "401": { description: Authentication required }
        "403": { description: Role or SCHOOL_TEACHERS_ASSIGN permission denied }
    put:
      operationId: organizationsUpsertTeachingAssignment
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [teacherId, classId]
              properties:
                teacherId: { type: string }
                classId: { type: string }
                subjectId:
                  type: string
                  default: ""
                  description: Empty keeps legacy subject-agnostic class assignment behavior.
                status: { type: string, enum: [active, ended, revoked], default: active }
      responses:
        "200": { description: Teaching assignment created or updated transactionally }
        "400": { description: Invalid assignment input }
        "401": { description: Authentication required }
        "403": { description: Platform admin or SCHOOL_TEACHERS_ASSIGN permission and CSRF required }
        "404": { description: School/class/teacher/subject relationship target not found }

  /api/school-access/context:
    get:
      deprecated: true
      operationId: legacySchoolAccessContext
      responses:
        "200": { description: Legacy-compatible school context response backed by canonical Organizations data }
        "401": { description: Authentication required }

  /api/school-access/memberships:
    put:
      deprecated: true
      operationId: legacySchoolAccessUpsertMembership
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schoolId, userId, role]
              properties:
                schoolId: { type: string }
                userId: { type: string }
                role: { type: string, enum: [student, teacher, supervisor, parent] }
                status: { type: string, enum: [active, inactive], default: active }
      responses:
        "200": { description: Legacy membership shape; inactive maps to canonical revoked }
        "400": { description: Invalid request }
        "401": { description: Authentication required }
        "403": { description: Platform admin role or CSRF denied }

  /api/school-access/directors/{schoolId}:
    get:
      deprecated: true
      operationId: legacySchoolAccessDirectors
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
      responses:
        "200": { description: Legacy flat director delegation shape backed by canonical memberships/permissions }
        "401": { description: Authentication required }
        "403": { description: Platform admin role required }

  /api/school-access/directors/{schoolId}/{userId}:
    put:
      deprecated: true
      operationId: legacySchoolAccessUpsertDirector
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - { in: path, name: userId, required: true, schema: { type: string } }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status: { type: string, enum: [active, inactive], default: active }
                permissions: { type: array, items: { type: string } }
      responses:
        "200": { description: Legacy director membership shape; inactive maps to canonical revoked }
        "400": { description: Invalid status or permission }
        "401": { description: Authentication required }
        "403": { description: Platform admin role or CSRF denied }

  /api/school-access/assignments:
    put:
      deprecated: true
      operationId: legacySchoolAccessUpsertTeachingAssignment
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schoolId, teacherId, classId]
              properties:
                schoolId: { type: string }
                teacherId: { type: string }
                classId: { type: string }
                subjectId: { type: string, default: "" }
                status: { type: string, enum: [active, inactive], default: active }
      responses:
        "200": { description: Legacy assignment shape; inactive maps to canonical ended }
        "400": { description: Invalid assignment input }
        "401": { description: Authentication required }
        "403": { description: Platform admin or school director permission and CSRF denied }

  /api/school-access/director/schools/{schoolId}/overview-access:
    get:
      deprecated: true
      operationId: legacyDirectorOverviewAccess
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
      responses:
        "200": { description: Legacy-compatible school director overview permission check }
        "401": { description: Authentication required }
        "403": { description: School director permission denied }

  /api/school-access/director/schools/{schoolId}/students:
    get:
      deprecated: true
      operationId: legacyDirectorStudents
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - { in: query, name: search, schema: { type: string, maxLength: 120 } }
      responses:
        "200": { description: Legacy-compatible student list; bounded to 500 lightweight records }
        "401": { description: Authentication required }
        "403": { description: SCHOOL_STUDENTS_VIEW denied }
    post:
      deprecated: true
      operationId: legacyDirectorAddStudent
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - { in: header, name: X-CSRF-Token, required: true, schema: { type: string } }
      responses:
        "200": { description: Existing student attached/reactivated in school }
        "201": { description: New student account created and attached }
        "400": { description: Invalid student/class payload }
        "403": { description: SCHOOL_STUDENTS_ADD or CSRF denied }
        "409": { description: Email belongs to non-student or student is active in another school }

  /api/school-access/director/schools/{schoolId}/students/{studentId}/class:
    put:
      deprecated: true
      operationId: legacyDirectorMoveStudentClass
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - { in: path, name: studentId, required: true, schema: { type: string } }
        - { in: header, name: X-CSRF-Token, required: true, schema: { type: string } }
      responses:
        "200": { description: Student class changed; response includes idempotent flag }
        "403": { description: SCHOOL_STUDENTS_MOVE_CLASS or CSRF denied }
        "404": { description: Student or class outside school }

  /api/school-access/director/schools/{schoolId}/students/{studentId}:
    patch:
      deprecated: true
      operationId: legacyDirectorUpdateStudentBasic
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - { in: path, name: studentId, required: true, schema: { type: string } }
        - { in: header, name: X-CSRF-Token, required: true, schema: { type: string } }
      responses:
        "200": { description: Student basic identity fields updated through Identity boundary }
        "403": { description: SCHOOL_STUDENTS_UPDATE_BASIC or CSRF denied }
        "404": { description: Student outside school }
        "409": { description: Identity value conflict }

  /api/school-access/director/schools/{schoolId}/students/{studentId}/active:
    patch:
      deprecated: true
      operationId: legacyDirectorSetStudentActive
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - { in: path, name: studentId, required: true, schema: { type: string } }
        - { in: header, name: X-CSRF-Token, required: true, schema: { type: string } }
      responses:
        "200": { description: Student account and school membership activation state updated atomically }
        "403": { description: SCHOOL_STUDENTS_DEACTIVATE or CSRF denied }
        "404": { description: Student outside school }

  /api/school-access/director/schools/{schoolId}/classes:
    post:
      deprecated: true
      operationId: legacyDirectorCreateClass
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - { in: header, name: X-CSRF-Token, required: true, schema: { type: string } }
      responses:
        "201": { description: Legacy-compatible class created }
        "403": { description: SCHOOL_CLASSES_MANAGE or CSRF denied }
        "409": { description: Duplicate class identity inside school }

  /api/school-access/director/schools/{schoolId}/classes/{classId}:
    patch:
      deprecated: true
      operationId: legacyDirectorUpdateClass
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - { in: path, name: classId, required: true, schema: { type: string } }
        - { in: header, name: X-CSRF-Token, required: true, schema: { type: string } }
      responses:
        "200": { description: Legacy-compatible class renamed }
        "403": { description: SCHOOL_CLASSES_MANAGE or CSRF denied }
        "404": { description: Class outside school }

  /api/school-access/director/schools/{schoolId}/teachers:
    get:
      deprecated: true
      operationId: legacyDirectorTeachers
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
      responses:
        "200": { description: Lightweight teacher list plus teaching assignments }
        "403": { description: SCHOOL_TEACHERS_ASSIGN denied }

  /api/school-access/director/schools/{schoolId}/assignments:
    put:
      deprecated: true
      operationId: legacyDirectorUpsertAssignment
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - { in: header, name: X-CSRF-Token, required: true, schema: { type: string } }
      responses:
        "200": { description: Teacher/class/subject assignment upserted }
        "400": { description: Teacher/class/subject scope invalid }
        "403": { description: SCHOOL_TEACHERS_ASSIGN or CSRF denied }

  /api/v1/auth/register:
    post:
      operationId: authRegister
      responses:
        "201": { description: Account and session created }
        "400": { description: Invalid request }
        "409": { description: Email already exists }

  /api/v1/auth/login:
    post:
      operationId: authLogin
      responses:
        "200": { description: Authenticated }
        "401": { description: Invalid credentials }
        "403": { description: Account disabled }
        "429": { description: Login locked }

  /api/v1/auth/login/national-id:
    post:
      operationId: authLoginNationalId
      responses:
        "200": { description: Authenticated }
        "401": { description: Invalid credentials }
        "403": { description: Account disabled }
        "429": { description: Login locked }

  /api/v1/auth/login/phone-password:
    post:
      operationId: authLoginPhonePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone, password]
              properties:
                phone: { type: string, minLength: 8, maxLength: 24 }
                password: { type: string, minLength: 1, maxLength: 160 }
      responses:
        "200": { description: Authenticated }
        "401": { description: Invalid credentials or password unavailable }
        "403": { description: Account disabled }
        "429": { description: Login locked }

  /api/v1/auth/whatsapp/start:
    post:
      operationId: authWhatsAppStart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone]
              properties:
                phone: { type: string, minLength: 8, maxLength: 24 }
      responses:
        "200": { description: OTP sent through configured WhatsApp provider }
        "400": { description: Invalid phone }
        "429": { description: Too many OTP requests }
        "503": { description: WhatsApp provider not configured or unavailable }

  /api/v1/auth/whatsapp/verify:
    post:
      operationId: authWhatsAppVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone, code]
              properties:
                phone: { type: string, minLength: 8, maxLength: 24 }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200": { description: OTP verified and authenticated session created }
        "400": { description: Invalid or expired OTP }
        "401": { description: Wrong OTP }
        "403": { description: Account disabled }
        "429": { description: Too many attempts }
        "503": { description: OTP security configuration unavailable }

  /api/v1/auth/google/start:
    get:
      operationId: authGoogleStart
      parameters:
        - in: query
          name: returnTo
          required: false
          schema: { type: string, default: "/" }
      responses:
        "302": { description: Redirect to Google OAuth authorization }
        "503": { description: Google OAuth not configured }

  /api/v1/auth/google/callback:
    get:
      operationId: authGoogleCallback
      parameters:
        - in: query
          name: code
          required: false
          schema: { type: string }
        - in: query
          name: state
          required: false
          schema: { type: string }
      responses:
        "302": { description: Redirect back to web app after success or failure }


  /api/v1/auth/admin/users:
    get:
      operationId: adminListUsers
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: search, schema: { type: string, maxLength: 120 } }
        - { in: query, name: role, schema: { type: string, enum: [student, teacher, admin, supervisor, school_admin, parent] } }
        - { in: query, name: isActive, schema: { type: boolean } }
        - { in: query, name: platformTrainer, schema: { type: boolean } }
      responses:
        "200": { description: Paginated user directory; supervisors and teachers are limited to shared active school/class scope }
        "401": { description: Authentication required }
        "403": { description: Role not permitted }
        "409": { description: platformTrainer filter is pending Catalog/Content trainer scope }
    post:
      operationId: adminUpsertUser
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email, password, role]
              properties:
                name: { type: string, minLength: 2 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 160 }
                role: { type: string, enum: [student, teacher, admin, supervisor, school_admin, parent] }
                schoolId: { type: [string, "null"] }
                groupIds: { type: array, items: { type: string } }
                linkedStudentIds: { type: array, items: { type: string } }
                managedPathIds: { type: array, items: { type: string } }
                managedSubjectIds: { type: array, items: { type: string } }
      responses:
        "201": { description: User account created or updated by email }
        "400": { description: Invalid request or last-admin invariant }
        "401": { description: Authentication required }
        "403": { description: Admin role required }
        "409": { description: managedPathIds/managedSubjectIds require Catalog/Content trainer scope integration }

  /api/v1/auth/admin/users/summary:
    get:
      operationId: adminUsersSummary
      responses:
        "200": { description: User totals, inactive count and counts by role; platform trainer count remains pending Catalog/Content scope }
        "401": { description: Authentication required }
        "403": { description: Admin role required }

  /api/v1/auth/admin/users/bulk-status:
    patch:
      operationId: adminBulkUserStatus
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userIds, isActive]
              properties:
                userIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string }
                isActive: { type: boolean }
      responses:
        "200": { description: Per-user updated/skipped/not_found results }
        "400": { description: Invalid request }
        "401": { description: Authentication required }
        "403": { description: Admin role required }

  /api/v1/auth/admin/users/{id}:
    patch:
      operationId: adminUpdateUser
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                avatar: { type: string, maxLength: 2000 }
                role: { type: string, enum: [student, teacher, admin, supervisor, school_admin, parent] }
                isActive: { type: boolean }
                schoolId: { type: [string, "null"] }
                groupIds: { type: array, items: { type: string } }
                linkedStudentIds: { type: array, items: { type: string } }
                managedPathIds: { type: array, items: { type: string } }
                managedSubjectIds: { type: array, items: { type: string } }
      responses:
        "200": { description: User account updated }
        "400": { description: Invalid request or operation would remove last active admin }
        "401": { description: Authentication required }
        "403": { description: Admin role required }
        "404": { description: User not found }
        "409": { description: Organization scope fields require Organizations domain integration }
    delete:
      operationId: adminDeleteUser
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "200": { description: User deleted }
        "400": { description: Self-delete or last-admin deletion blocked }
        "401": { description: Authentication required }
        "403": { description: Admin role required }
        "404": { description: User not found }

  /api/v1/auth/me:
    get:
      operationId: authMe
      responses:
        "200": { description: Current user }
        "401": { description: Authentication required }

  /api/v1/auth/me/profile:
    patch:
      operationId: authUpdateMyProfile
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                avatar: { type: string, maxLength: 2000 }
      responses:
        "200": { description: Profile updated }
        "400": { description: Invalid request }
        "401": { description: Authentication required }
        "403": { description: Invalid CSRF token }

  /api/v1/auth/me/identity:
    patch:
      operationId: authUpdateMyIdentity
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                nationalId: { type: [string, "null"], pattern: "^[12][0-9]{9}$" }
                phone: { type: [string, "null"], minLength: 8, maxLength: 24 }
      responses:
        "200": { description: Login identity updated }
        "400": { description: Invalid request }
        "401": { description: Authentication required }
        "403": { description: Invalid CSRF token }
        "409": { description: Identity value already in use or removal would remove final login identity }

  /api/v1/auth/csrf:
    get:
      operationId: authCsrf
      responses:
        "200": { description: Rotated CSRF token }
        "401": { description: Authentication required }

  /api/v1/auth/csrf-token:
    get:
      deprecated: true
      operationId: authCsrfLegacyAlias
      responses:
        "200": { description: Legacy alias of /api/v1/auth/csrf }
        "401": { description: Authentication required }

  /api/v1/auth/email/resend-verification:
    post:
      deprecated: true
      operationId: authResendEmailVerificationLegacyAlias
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "200": { description: Legacy alias of /api/v1/auth/email/resend }
        "401": { description: Authentication required }
        "403": { description: Invalid CSRF token }

  /api/v1/auth/google/call:
    get:
      deprecated: true
      operationId: authGoogleCallbackLegacyAlias
      parameters:
        - { in: query, name: code, required: false, schema: { type: string } }
        - { in: query, name: state, required: false, schema: { type: string } }
      responses:
        "302": { description: Legacy alias of Google callback }

  /api/v1/auth/logout:
    post:
      operationId: authLogout
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "204": { description: Logged out }
        "403": { description: Invalid CSRF token }

  /api/v1/auth/forgot-password:
    post:
      operationId: authForgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { description: Generic recovery response }
        "500": { description: Recovery service unavailable }

  /api/v1/auth/reset-password:
    post:
      operationId: authResetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string, minLength: 16 }
                password: { type: string, minLength: 8, maxLength: 160 }
      responses:
        "200": { description: Password reset and active sessions revoked }
        "400": { description: Invalid request or expired token }

  /api/v1/auth/email/verify:
    post:
      operationId: authVerifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, minLength: 16 }
      responses:
        "200": { description: Email verified }
        "400": { description: Invalid or expired token }

  /api/v1/auth/email/resend:
    post:
      operationId: authResendEmailVerification
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "200": { description: Verification delivery queued }
        "401": { description: Authentication required }
        "403": { description: Invalid CSRF token }
        "500": { description: Delivery unavailable }
