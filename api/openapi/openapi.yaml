        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userIds, isActive]
              properties:
                userIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string }
                isActive: { type: boolean }
      responses:
        "200": { description: Per-user updated/skipped/not_found results }
        "400": { description: Invalid request }
        "401": { description: Authentication required }
        "403": { description: Admin role required }

  /api/v1/auth/admin/users/{id}:
    patch:
      operationId: adminUpdateUser
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                avatar: { type: string, maxLength: 2000 }
                role: { type: string, enum: [student, teacher, admin, supervisor, school_admin, parent] }
                isActive: { type: boolean }
                schoolId: { type: [string, "null"] }
                groupIds: { type: array, items: { type: string } }
                linkedStudentIds: { type: array, items: { type: string } }
                managedPathIds: { type: array, maxItems: 50, items: { type: string }, description: Compatibility form mapped transactionally to canonical Content trainer scope; teacher role only. Empty array revokes path scope. }
                managedSubjectIds: { type: array, maxItems: 200, items: { type: string }, description: Compatibility form mapped transactionally to canonical Content trainer scope; teacher role only. Empty array revokes subject scope. }
      responses:
        "200": { description: User account updated }
        "400": { description: Invalid request or operation would remove last active admin }
        "401": { description: Authentication required }
        "403": { description: Admin role required }
        "404": { description: User not found }
        "409": { description: Organization or managed trainer scope conflicts with canonical relations }
    delete:
      operationId: adminDeleteUser
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "200": { description: User deleted }
        "400": { description: Self-delete or last-admin deletion blocked }
        "401": { description: Authentication required }
        "403": { description: Admin role required }
        "404": { description: User not found }

  /api/v1/auth/me:
    get:
      operationId: authMe
