openapi: 3.1.0
info:
  title: ALMEAA API
  version: 0.3.0
paths:
  /health/live:
    get:
      operationId: healthLive
      responses:
        "200": { description: Process is alive }
  /health/ready:
    get:
      operationId: healthReady
      responses:
        "200": { description: Core dependencies are reachable }
        "503": { description: Dependency unavailable }

  /api/v1/auth/register:
    post:
      operationId: authRegister
      responses:
        "201": { description: Account and session created }
        "400": { description: Invalid request }
        "409": { description: Email already exists }

  /api/v1/auth/login:
    post:
      operationId: authLogin
      responses:
        "200": { description: Authenticated }
        "401": { description: Invalid credentials }
        "403": { description: Account disabled }
        "429": { description: Login locked }

  /api/v1/auth/login/national-id:
    post:
      operationId: authLoginNationalId
      responses:
        "200": { description: Authenticated }
        "401": { description: Invalid credentials }
        "403": { description: Account disabled }
        "429": { description: Login locked }

  /api/v1/auth/login/phone-password:
    post:
      operationId: authLoginPhonePassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone, password]
              properties:
                phone: { type: string, minLength: 8, maxLength: 24 }
                password: { type: string, minLength: 1, maxLength: 160 }
      responses:
        "200": { description: Authenticated }
        "401": { description: Invalid credentials or password unavailable }
        "403": { description: Account disabled }
        "429": { description: Login locked }

  /api/v1/auth/whatsapp/start:
    post:
      operationId: authWhatsAppStart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone]
              properties:
                phone: { type: string, minLength: 8, maxLength: 24 }
      responses:
        "200": { description: OTP sent through configured WhatsApp provider }
        "400": { description: Invalid phone }
        "429": { description: Too many OTP requests }
        "503": { description: WhatsApp provider not configured or unavailable }

  /api/v1/auth/whatsapp/verify:
    post:
      operationId: authWhatsAppVerify
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone, code]
              properties:
                phone: { type: string, minLength: 8, maxLength: 24 }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200": { description: OTP verified and authenticated session created }
        "400": { description: Invalid or expired OTP }
        "401": { description: Wrong OTP }
        "403": { description: Account disabled }
        "429": { description: Too many attempts }
        "503": { description: OTP security configuration unavailable }

  /api/v1/auth/google/start:
    get:
      operationId: authGoogleStart
      parameters:
        - in: query
          name: returnTo
          required: false
          schema: { type: string, default: "/" }
      responses:
        "302": { description: Redirect to Google OAuth authorization }
        "503": { description: Google OAuth not configured }

  /api/v1/auth/google/callback:
    get:
      operationId: authGoogleCallback
      parameters:
        - in: query
          name: code
          required: false
          schema: { type: string }
        - in: query
          name: state
          required: false
          schema: { type: string }
      responses:
        "302": { description: Redirect back to web app after success or failure }


  /api/v1/auth/admin/users:
    get:
      operationId: adminListUsers
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: search, schema: { type: string, maxLength: 120 } }
        - { in: query, name: role, schema: { type: string, enum: [student, teacher, admin, supervisor, school_admin, parent] } }
        - { in: query, name: isActive, schema: { type: boolean } }
        - { in: query, name: platformTrainer, schema: { type: boolean } }
      responses:
        "200": { description: Paginated user directory; supervisors and teachers are limited to shared active school/class scope }
        "401": { description: Authentication required }
        "403": { description: Role not permitted }
        "409": { description: platformTrainer filter is pending Catalog/Content trainer scope }
    post:
      operationId: adminUpsertUser
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, email, password, role]
              properties:
                name: { type: string, minLength: 2 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 160 }
                role: { type: string, enum: [student, teacher, admin, supervisor, school_admin, parent] }
                schoolId: { type: [string, "null"] }
                groupIds: { type: array, items: { type: string } }
                linkedStudentIds: { type: array, items: { type: string } }
                managedPathIds: { type: array, items: { type: string } }
                managedSubjectIds: { type: array, items: { type: string } }
      responses:
        "201": { description: User account created or updated by email }
        "400": { description: Invalid request or last-admin invariant }
        "401": { description: Authentication required }
        "403": { description: Admin role required }
        "409": { description: managedPathIds/managedSubjectIds require Catalog/Content trainer scope integration }

  /api/v1/auth/admin/users/summary:
    get:
      operationId: adminUsersSummary
      responses:
        "200": { description: User totals, inactive count and counts by role; platform trainer count remains pending Catalog/Content scope }
        "401": { description: Authentication required }
        "403": { description: Admin role required }

  /api/v1/auth/admin/users/bulk-status:
    patch:
      operationId: adminBulkUserStatus
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userIds, isActive]
              properties:
                userIds:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string }
                isActive: { type: boolean }
      responses:
        "200": { description: Per-user updated/skipped/not_found results }
        "400": { description: Invalid request }
        "401": { description: Authentication required }
        "403": { description: Admin role required }

  /api/v1/auth/admin/users/{id}:
    patch:
      operationId: adminUpdateUser
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                avatar: { type: string, maxLength: 2000 }
                role: { type: string, enum: [student, teacher, admin, supervisor, school_admin, parent] }
                isActive: { type: boolean }
                schoolId: { type: [string, "null"] }
                groupIds: { type: array, items: { type: string } }
                linkedStudentIds: { type: array, items: { type: string } }
                managedPathIds: { type: array, items: { type: string } }
                managedSubjectIds: { type: array, items: { type: string } }
      responses:
        "200": { description: User account updated }
        "400": { description: Invalid request or operation would remove last active admin }
        "401": { description: Authentication required }
        "403": { description: Admin role required }
        "404": { description: User not found }
        "409": { description: Organization scope fields require Organizations domain integration }
    delete:
      operationId: adminDeleteUser
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "200": { description: User deleted }
        "400": { description: Self-delete or last-admin deletion blocked }
        "401": { description: Authentication required }
        "403": { description: Admin role required }
        "404": { description: User not found }

  /api/v1/auth/me:
    get:
      operationId: authMe
      responses:
        "200": { description: Current user }
        "401": { description: Authentication required }

  /api/v1/auth/me/profile:
    patch:
      operationId: authUpdateMyProfile
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 2, maxLength: 120 }
                avatar: { type: string, maxLength: 2000 }
      responses:
        "200": { description: Profile updated }
        "400": { description: Invalid request }
        "401": { description: Authentication required }
        "403": { description: Invalid CSRF token }

  /api/v1/auth/me/identity:
    patch:
      operationId: authUpdateMyIdentity
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                nationalId: { type: [string, "null"], pattern: "^[12][0-9]{9}$" }
                phone: { type: [string, "null"], minLength: 8, maxLength: 24 }
      responses:
        "200": { description: Login identity updated }
        "400": { description: Invalid request }
        "401": { description: Authentication required }
        "403": { description: Invalid CSRF token }
        "409": { description: Identity value already in use or removal would remove final login identity }

  /api/v1/auth/csrf:
    get:
      operationId: authCsrf
      responses:
        "200": { description: Rotated CSRF token }
        "401": { description: Authentication required }

  /api/v1/auth/logout:
    post:
      operationId: authLogout
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "204": { description: Logged out }
        "403": { description: Invalid CSRF token }

  /api/v1/auth/forgot-password:
    post:
      operationId: authForgotPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { description: Generic recovery response }
        "500": { description: Recovery service unavailable }

  /api/v1/auth/reset-password:
    post:
      operationId: authResetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token, password]
              properties:
                token: { type: string, minLength: 16 }
                password: { type: string, minLength: 8, maxLength: 160 }
      responses:
        "200": { description: Password reset and active sessions revoked }
        "400": { description: Invalid request or expired token }

  /api/v1/auth/email/verify:
    post:
      operationId: authVerifyEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token: { type: string, minLength: 16 }
      responses:
        "200": { description: Email verified }
        "400": { description: Invalid or expired token }

  /api/v1/auth/email/resend:
    post:
      operationId: authResendEmailVerification
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "200": { description: Verification delivery queued }
        "401": { description: Authentication required }
        "403": { description: Invalid CSRF token }
        "500": { description: Delivery unavailable }
