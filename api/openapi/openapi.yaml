                name: { type: string, minLength: 2 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 160 }
                role: { type: string, enum: [student, teacher, admin, supervisor, school_admin, parent] }
                schoolId: { type: [string, "null"] }
                groupIds: { type: array, items: { type: string } }
                linkedStudentIds: { type: array, items: { type: string } }
                managedPathIds: { type: array, maxItems: 50, items: { type: string }, description: Compatibility form mapped transactionally to canonical Content trainer scope; teacher role only. }
                managedSubjectIds: { type: array, maxItems: 200, items: { type: string }, description: Compatibility form mapped transactionally to canonical Content trainer scope; teacher role only. }
      responses:
        "201": { description: User account created or updated by email }
        "400": { description: Invalid request or last-admin invariant }
        "401": { description: Authentication required }
        "403": { description: Admin role required }
        "409": { description: Managed trainer scope conflicts with role or active taxonomy }

  /api/v1/auth/admin/users/summary:
    get:
      operationId: adminUsersSummary
      responses:
        "200": { description: User totals, inactive count, counts by role, and canonical active platform-trainer count }
        "401": { description: Authentication required }
        "403": { description: Admin role required }

  /api/v1/auth/admin/users/bulk-status:
