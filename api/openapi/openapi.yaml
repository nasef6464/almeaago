openapi: 3.1.0
info:
  title: ALMEAA API
  version: 0.4.0
paths:
  /api/v1/taxonomy/bootstrap:
    get:
      operationId: taxonomyPublicBootstrap
      parameters:
        - in: query
          name: phase
          schema: { type: string, enum: [core, compact, full], default: full }
      responses:
        "200": { description: Active normalized taxonomy hierarchy; core omits skills }
        "400": { description: Invalid bootstrap phase }
        "500": { description: Taxonomy unavailable }

  /api/v1/taxonomy/admin/paths:
    post:
      operationId: taxonomyAdminCreatePath
      description: Platform-admin only. Codes are immutable after creation; CSRF required.
      responses:
        "201": { description: Path created }
        "400": { description: Invalid hierarchy input }
        "403": { description: Admin role or CSRF required }
        "409": { description: Taxonomy hierarchy conflict }
  /api/v1/taxonomy/admin/paths/{id}:
    patch:
      operationId: taxonomyAdminUpdatePath
      description: Lifecycle-safe path update; code is not mutable.
      responses:
        "200": { description: Path updated }
        "404": { description: Path not found }
        "409": { description: Taxonomy hierarchy conflict }
  /api/v1/taxonomy/admin/levels:
    post:
      operationId: taxonomyAdminCreateLevel
      responses:
        "201": { description: Level created under an active path }
  /api/v1/taxonomy/admin/levels/{id}:
    patch:
      operationId: taxonomyAdminUpdateLevel
      responses:
        "200": { description: Level updated }
  /api/v1/taxonomy/admin/subjects:
    post:
      operationId: taxonomyAdminCreateSubject
      responses:
        "201": { description: Subject created with optional same-path active level }
  /api/v1/taxonomy/admin/subjects/{id}:
    patch:
      operationId: taxonomyAdminUpdateSubject
      responses:
        "200": { description: Subject updated }
  /api/v1/taxonomy/admin/skills:
    post:
      operationId: taxonomyAdminCreateSkill
      responses:
        "201": { description: Main/sub skill created with hierarchy validation }
  /api/v1/taxonomy/admin/skills/{id}:
    patch:
      operationId: taxonomyAdminUpdateSkill
      responses:
        "200": { description: Skill updated without changing stable code/kind/subject }

  /api/v1/questions:
    get:
      operationId: questionBankStaffList
      description: >
        Bounded staff Question Bank list. Default limit 80, maximum 100. Teacher access
        is forcibly scoped to owned/assigned questions. Platform-trainer scope is canonical
        in Content; an exact pathId+subjectId filter may also be authorized by an active
        Organizations teaching assignment. Exact coverage counts are not computed on this normal list path.
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 80 } }
        - { in: query, name: search, schema: { type: string, maxLength: 200 } }
        - { in: query, name: pathId, schema: { type: string } }
        - { in: query, name: subjectId, schema: { type: string } }
        - { in: query, name: mainSkillId, schema: { type: string } }
        - { in: query, name: skillId, schema: { type: string }, description: Repeatable skill filter; any matching skill qualifies. }
        - { in: query, name: linked, schema: { type: boolean } }
        - { in: query, name: difficulty, schema: { type: string } }
        - { in: query, name: type, schema: { type: string, enum: [mcq, true_false, essay] } }
        - { in: query, name: examType, schema: { type: string } }
        - { in: query, name: source, schema: { type: string } }
        - { in: query, name: year, schema: { type: integer } }
        - { in: query, name: workflowStatus, schema: { type: string, enum: [draft, pending_review, approved, rejected, archived] } }
        - { in: query, name: withVideo, schema: { type: boolean } }
        - { in: query, name: withExplanation, schema: { type: boolean } }
      responses:
        "200": { description: Bounded staff summary page with hasMore }
        "400": { description: Invalid filter or pagination }
        "401": { description: Authentication required }
        "403": { description: Staff role required }
    post:
      operationId: questionBankCreate
      description: >
        Create a stable question identity with version 1. Staff-only and CSRF-protected.
        Teachers may author only inside canonical active Content platform-trainer scope or an
        exact active Organizations teaching assignment; admin assignment is rejected outside
        the target teacher's combined authoring scope.
        A question may be text-only, image-only, or text+image. Image bytes are never sent
        through this endpoint; media is referenced by asset ID. AI-readable metadata stays
        server-side in the staff version payload.
      responses:
        "201": { description: Draft question created }
        "400": { description: Invalid question/version payload }
        "403": { description: Staff role or CSRF denied }
        "409": { description: Question code, taxonomy, asset, or hierarchy conflict }

  /api/v1/questions/coverage:
    get:
      operationId: questionBankCoverage
      description: >
        Separate filtered coverage/count endpoint so normal list reads stay bounded.
        Questions linked to multiple skills count once in Questions Total and once in each
        relevant per-skill count. Skill coverage rows are independently paginated to max 100.
      parameters:
        - { in: query, name: skillPage, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: skillLimit, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        "200": { description: Scoped aggregate and paginated per-skill coverage }
        "400": { description: Invalid filter or pagination }
        "401": { description: Authentication required }
        "403": { description: Staff role required }

  /api/v1/questions/import-batches:
    post:
      operationId: questionBankImportBatchV2
      description: >
        Platform-admin-only V2 quantitative question import. dryRun defaults to true.
        A write is accepted only after the server has recorded a successful matching durable PostgreSQL preflight for the exact normalized manifest. Maximum 100 items. Image bytes must already be uploaded
        and verified by Media/R2; this endpoint accepts metadata/asset IDs only.
      responses:
        "200": { description: Dry-run PASS report }
        "201": { description: Draft-only batch imported }
        "400": { description: Invalid batch/item/canonical source identity }
        "403": { description: Platform admin or CSRF denied }
        "409": { description: Existing identity/hash conflict or matching dry-run required }

  /api/v1/questions/import-batches/{batchId}:
    get:
      operationId: questionBankImportBatchStatus
      description: Platform-admin import report and current question workflow states.
      responses:
        "200": { description: Durable import batch report }
        "400": { description: Invalid batch ID }
        "403": { description: Platform admin required }
        "404": { description: Import batch not found }

  /api/v1/questions/import-batches/{batchId}/rollback:
    post:
      operationId: questionBankRollbackImportBatch
      description: >
        Archive-only rollback. The entire batch must still be draft. Question rows,
        stable IDs, provenance and history are retained rather than hard-deleted.
      responses:
        "200": { description: Batch rolled back by archiving imported drafts }
        "400": { description: Invalid batch ID }
        "403": { description: Platform admin or CSRF denied }
        "404": { description: Import batch not found }
        "409": { description: Batch contains non-draft questions or was already rolled back }

  /api/v1/questions/{id}:
    get:
      operationId: questionBankLearnerGet
      description: >
        Approved learner-safe question projection. Does not expose correctOptionIndex,
        explanation, hint, solvingStrategy, sourceMeta, full aiContext, voiceExplanation,
        reviewer notes, or approval internals.
      responses:
        "200": { description: Approved learner-safe question }
        "401": { description: Authentication required }
        "404": { description: Question unavailable or not approved }

  /api/v1/questions/{id}/staff:
    get:
      operationId: questionBankStaffGet
      description: Staff-authorized current version including workflow/private authoring metadata.
      responses:
        "200": { description: Staff question projection }
        "401": { description: Authentication required }
        "403": { description: Edit scope denied }
        "404": { description: Question not found }

  /api/v1/questions/{id}/versions:
    post:
      operationId: questionBankAppendVersion
      description: >
        Append an immutable material revision using optimistic expectedCurrentVersion.
        Approved/archived questions are not silently edited in place.
      responses:
        "200": { description: New current version appended }
        "400": { description: Invalid version payload }
        "403": { description: Edit scope or CSRF denied }
        "409": { description: Version, taxonomy, asset, or workflow conflict }

  /api/v1/questions/{id}/workflow:
    patch:
      operationId: questionBankSetWorkflow
      description: >
        Lifecycle transition for draft/pending_review/approved/rejected/archived using
        optimistic expectedCurrentVersion. Approval requires publishable answer metadata.
      responses:
        "200": { description: Workflow state updated }
        "400": { description: Invalid workflow payload }
        "403": { description: Role/scope or CSRF denied }
        "404": { description: Question not found }
        "409": { description: Invalid workflow or version conflict }


  /api/v1/assessment-attempts/results:
    get:
      operationId: assessmentLearnerResultHistory
      description: >
        Student-only bounded submitted-result history. Defaults to 20 rows and caps at 100.
        Uses hasMore and does not hydrate question review or require an exact-count query.
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200": { description: Learner-owned bounded result history page }
        "400": { description: Invalid bounded pagination }
        "401": { description: Authentication required }
        "403": { description: Student role required }

  /api/v1/assessment-attempts/{id}/review:
    get:
      operationId: assessmentLearnerResultReview
      description: >
        Student-owned submitted-result detail from the exact Assessment version.
        If allowQuestionReview=false no question rows are returned. correctOptionIndex is
        omitted when showAnswers=false; explanation/hint/solvingStrategy are omitted when
        showExplanations=false.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Policy-governed learner result detail }
        "400": { description: Invalid attempt id }
        "401": { description: Authentication required }
        "403": { description: Student role required }
        "404": { description: Submitted result not found for this learner }


  /api/v1/assessments/{id}/placements:
    get:
      operationId: assessmentStaffLearningPlacementList
      description: >
        Staff-authorized bounded placement list for one Assessment. The Assessment definition
        authorization contract is reused; normal reads use hasMore rather than exact counts.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { description: Bounded Assessment placement page }
        "401": { description: Authentication required }
        "403": { description: Assessment edit scope denied }
    post:
      operationId: assessmentStaffLearningPlacementCreate
      description: >
        CSRF-protected placement create. The placement pins the currently published Assessment
        version. Content validates Course/Lesson/Foundation targets through a domain boundary;
        Assessment stores IDs only.
      responses:
        "201": { description: Learning placement created }
        "400": { description: Invalid placement target shape }
        "403": { description: Staff scope or CSRF denied }
        "409": { description: Assessment state, duplicate placement, taxonomy or Content target conflict }

  /api/v1/assessment-placements/{id}:
    patch:
      operationId: assessmentStaffLearningPlacementPatch
      description: >
        CSRF-protected optimistic visibility/order update using expectedUpdatedAt. Target IDs
        and pinned Assessment version are immutable in this slice.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Placement updated }
        "400": { description: Invalid optimistic patch }
        "403": { description: Staff scope or CSRF denied }
        "409": { description: Concurrent placement update conflict }

  /api/v1/assessment-placements/available:
    get:
      operationId: assessmentLearnerLearningPlacementList
      description: >
        Student-only bounded availability. Requires exact pathId + subjectId + slot. Course
        and Foundation slots also require exact learner-safe Content context. No broad
        Assessment or Content inventory is loaded.
      parameters:
        - { in: query, name: slot, required: true, schema: { type: string, enum: [training, tests, foundation, course] } }
        - { in: query, name: pathId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: subjectId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: courseId, schema: { type: string, format: uuid } }
        - { in: query, name: lessonId, schema: { type: string, format: uuid } }
        - { in: query, name: topicId, schema: { type: string, format: uuid } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        "200": { description: Bounded learner-safe placement availability page }
        "400": { description: Invalid or incomplete exact learning context }
        "401": { description: Authentication required }
        "403": { description: Student role required }
        "409": { description: Content target is no longer learner-safe }

  /api/v1/assessment-placements/{id}/start:
    post:
      operationId: assessmentLearnerLearningPlacementStart
      description: >
        CSRF-protected idempotent student start in exact placement context. Enforces the
        placement-pinned Assessment version, placement attempt budget, server expiry and
        learner-safe Attempt projection.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "201": { description: Placement-context attempt started or idempotently resumed }
        "400": { description: Invalid start key }
        "403": { description: Student role/CSRF or hidden placement denied }
        "409": { description: Attempt budget or Assessment/Content state conflict }

  /api/v1/assessment-sessions:
    get:
      operationId: assessmentStaffSessionList
      description: Staff-authorized bounded Session distribution list for one Assessment.
      parameters:
        - { in: query, name: assessmentId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { description: Bounded session page }
        "401": { description: Authentication required }
        "403": { description: Assessment staff scope denied }
    post:
      operationId: assessmentStaffSessionCreate
      description: >
        CSRF-protected Session create. Pins the currently published Assessment version and
        returns a server-generated stable entry code. New sessions are scheduled, not active.
      responses:
        "201": { description: Session created }
        "400": { description: Invalid channel/window/scope shape }
        "403": { description: Staff scope or CSRF denied }
        "409": { description: Assessment or organization scope conflict }

  /api/v1/assessment-sessions/{id}/status:
    patch:
      operationId: assessmentStaffSessionStatus
      description: CSRF-protected scheduled/active/closed/cancelled transition.
      responses:
        "200": { description: Session status updated }
        "403": { description: Staff scope or CSRF denied }
        "409": { description: Session state/scope conflict }

  /api/v1/assessment-sessions/join/{code}:
    get:
      operationId: assessmentLearnerLiveSessionJoin
      description: >
        Student-only live-session lookup. Enforces active window and school/class membership
        when the Session is organization-scoped.
      responses:
        "200": { description: Learner-safe live Session summary }
        "401": { description: Authentication required }
        "403": { description: Student role required }
        "404": { description: Session not available in learner scope }

  /api/v1/assessment-sessions/{id}/start:
    post:
      operationId: assessmentLearnerLiveSessionStart
      description: >
        CSRF-protected idempotent live-session attempt start using the Session-pinned exact
        Assessment version and canonical Attempt runner.
      responses:
        "201": { description: Session-context Attempt started or resumed }
        "403": { description: Student role/scope or CSRF denied }
        "409": { description: Attempt budget/session state conflict }

  /api/v1/public-assessments/{code}/start:
    post:
      operationId: assessmentPublicSessionStart
      description: >
        Anonymous public/barcode start. Uses opaque participant/start keys, creates a
        normalized public attempt, enforces server expiry and never exposes answer keys.
      responses:
        "201": { description: Public attempt and learner-safe questions }
        "400": { description: Invalid opaque keys }
        "404": { description: Public session unavailable }
        "409": { description: Attempt budget or assessment state conflict }

  /api/v1/public-assessments/{code}/submit:
    post:
      operationId: assessmentPublicSessionSubmit
      description: >
        Anonymous retry-safe submission. Answers reference canonical Assessment/Question
        versions; correctness and score are computed server-side. Result visibility follows
        the exact pinned Assessment version.
      responses:
        "200": { description: Submission accepted; result included only when policy permits }
        "400": { description: Invalid participant/submission payload }
        "404": { description: Public attempt/session unavailable }
        "409": { description: Expired, duplicate, attempt-budget, answer-integrity or submission-cap conflict }


  /api/v1/review/library:
    get:
      operationId: learningReviewLibrary
      description: >
        Student-only path-scoped review library. Combines saved and mistake reasons on one
        canonical learner/question ReviewCard, defaults to 20 rows, caps at 50, and uses
        hasMore without an exact-count scan. Exact Question versions are composed in one
        bounded Question Bank batch.
      parameters:
        - { in: query, name: tab, schema: { type: string, enum: [saved, mistakes, all], default: all } }
        - { in: query, name: pathId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: subjectId, schema: { type: string, format: uuid } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200": { description: Bounded learner review page }
        "400": { description: Invalid scope or pagination }
        "401": { description: Authentication required }
        "403": { description: Student role required }


  /api/v1/review/practice:
    get:
      operationId: learningDueReviewPractice
      description: >
        Student-only bounded due ReviewCard discovery. Requires pathId, optionally narrows by
        subject/tab, defaults to 20 and caps at 50. Exact Question versions are composed in one
        bounded Question Bank batch. The response deliberately omits correctOptionIndex,
        explanation, hint and solvingStrategy before the learner submits an answer.
      parameters:
        - { in: query, name: tab, schema: { type: string, enum: [saved, mistakes, all], default: all } }
        - { in: query, name: pathId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: subjectId, schema: { type: string, format: uuid } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
      responses:
        "200": { description: Bounded due practice page with learner-safe Question projections }
        "400": { description: Invalid path scope or pagination }
        "401": { description: Authentication required }
        "403": { description: Student role required }

  /api/v1/review/cards/{id}/answer:
    post:
      operationId: learningSubmitReviewAnswer
      description: >
        Student-only CSRF-protected idempotent ReviewCard answer. The server reads the exact
        canonical Question version, validates the selected option, scores it server-side,
        inserts one remediation/mastery-review evidence event, advances SM-2 and returns the
        answer key/explanation only after submission.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Server-scored answer feedback and next review schedule }
        "400": { description: Invalid key, option or optimistic timestamp }
        "401": { description: Authentication required }
        "403": { description: Student role or CSRF denied }
        "404": { description: ReviewCard not found for this learner }
        "409": { description: Card not due, concurrent card change or idempotency conflict }

  /api/v1/review/questions/{id}/saved:
    put:
      operationId: learningSaveReviewQuestion
      description: >
        CSRF-protected Student mutation that adds the saved-for-review reason to an existing
        canonical ReviewCard. It never creates a duplicate card for a mistake.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Saved reason applied idempotently }
        "403": { description: Student role or CSRF denied }
        "404": { description: ReviewCard does not exist for this learner/question }
    delete:
      operationId: learningUnsaveReviewQuestion
      description: >
        CSRF-protected Student mutation that removes only the saved reason. Mistake/mastery
        review state remains canonical on the same card.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Saved reason removed idempotently }
        "403": { description: Student role or CSRF denied }

  /api/v1/mastery/progress:
    get:
      operationId: learningMasteryProgress
      description: >
        Student-only path-scoped current mastery materialization from canonical evidence.
        Defaults to 50 rows, caps at 100 and never returns raw evidence history.
      parameters:
        - { in: query, name: pathId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: subjectId, schema: { type: string, format: uuid } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        "200": { description: Bounded mastery progress page }
        "400": { description: Invalid path scope or pagination }
        "401": { description: Authentication required }
        "403": { description: Student role required }

  /api/v1/mastery/next-action:
    get:
      operationId: learningMasteryNextAction
      description: >
        Student-only deterministic weakest-skill next action for the selected path/subject.
        AI is not a source of truth for this value.
      parameters:
        - { in: query, name: pathId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: subjectId, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Weakest current skill progress item or null when evidence is absent }
        "400": { description: Invalid path scope }
        "401": { description: Authentication required }
        "403": { description: Student role required }

  /api/v1/media/uploads/presign:
    post:
      operationId: mediaPresignUpload
      description: >
        Staff-only CSRF-protected authorization for direct R2 upload. The Go API receives
        metadata only, never image/audio bytes. Supported question images are JPEG/PNG/WebP.
        Verified SHA-256 hashes are deduplicated.
      responses:
        "200": { description: Existing verified asset or short-lived signed PUT target }
        "400": { description: Invalid purpose, MIME, size, question code, or SHA-256 }
        "401": { description: Authentication required }
        "403": { description: Staff role or CSRF denied }
        "409": { description: Existing hash metadata conflicts }
        "503": { description: R2 provider not configured or unavailable }

  /api/v1/media/uploads/{id}/complete:
    post:
      operationId: mediaCompleteUpload
      description: >
        Verify the uploaded R2 object with authenticated HEAD. Size, MIME and signed
        x-amz-meta-sha256 must match the reserved asset before it becomes active.
      responses:
        "200": { description: Verified active asset }
        "401": { description: Authentication required }
        "403": { description: Asset ownership/admin scope or CSRF denied }
        "404": { description: Asset not found }
        "409": { description: R2 object missing or metadata verification failed }
        "503": { description: R2 provider unavailable }

  /api/v1/media/assets/{id}:
    get:
      operationId: mediaGetAsset
      description: >
        Authenticated asset metadata lookup. Active assets are readable by authenticated
        consumers; pending assets remain restricted to their creator/platform admin.
      responses:
        "200": { description: Asset metadata and CDN/public URL }
        "401": { description: Authentication required }
        "404": { description: Asset not found or not visible }


  /health/live:
    get:
      operationId: healthLive
      responses:
        "200": { description: Process is alive }
  /health/ready:
    get:
      operationId: healthReady
      responses:
        "200": { description: Core dependencies are reachable }
        "503": { description: Dependency unavailable }

  /api/v1/schools/context:
    get:
      operationId: organizationsSchoolContexts
      responses:
        "200": { description: Canonical active school contexts for the authenticated user }
        "401": { description: Authentication required }

  /api/v1/parents/authority:
    get:
      operationId: organizationsParentAuthority
      description: >
        Canonical Organizations-owned parent-to-student authority projection.
        Returns identifiers and relationship scope only; student profile/progress/reporting
        data remains owned by Identity/Reporting/Learning.
      responses:
        "200": { description: Active canonical parent-to-student relationships }
        "401": { description: Authentication required }
        "403": { description: Parent role required }

  /api/v1/schools/teacher-workspace:
    get:
      operationId: organizationsTeacherWorkspace
      description: >
        Organizations-owned structural workspace for an authenticated teacher. Returns active
        school/class/subject assignments and aggregate student counts, plus a platformTrainer
        persona boolean resolved from Content's canonical active trainer scope. Organizations
        does not infer platform-trainer authority from school membership. Entitlements,
        assessments, realtime state, and reporting data remain owned by their domains.
      responses:
        "200": { description: Scoped teacher school assignments }
        "401": { description: Authentication required }
        "403": { description: Teacher role required }

  /api/v1/schools:
    get:
      operationId: organizationsListSchools
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
