openapi: 3.1.0
info:
  title: ALMEAA API
  version: 0.4.0
paths:
  /api/v1/taxonomy/bootstrap:
    get:
      operationId: taxonomyPublicBootstrap
      parameters:
        - in: query
          name: phase
          schema: { type: string, enum: [core, compact, full], default: full }
      responses:
        "200": { description: Active normalized taxonomy hierarchy; core omits skills }
        "400": { description: Invalid bootstrap phase }
        "500": { description: Taxonomy unavailable }

  /api/v1/taxonomy/admin/paths:
    post:
      operationId: taxonomyAdminCreatePath
      description: Platform-admin only. Codes are immutable after creation; CSRF required.
      responses:
        "201": { description: Path created }
        "400": { description: Invalid hierarchy input }
        "403": { description: Admin role or CSRF required }
        "409": { description: Taxonomy hierarchy conflict }
  /api/v1/taxonomy/admin/paths/{id}:
    patch:
      operationId: taxonomyAdminUpdatePath
      description: Lifecycle-safe path update; code is not mutable.
      responses:
        "200": { description: Path updated }
        "404": { description: Path not found }
        "409": { description: Taxonomy hierarchy conflict }
  /api/v1/taxonomy/admin/levels:
    post:
      operationId: taxonomyAdminCreateLevel
      responses:
        "201": { description: Level created under an active path }
  /api/v1/taxonomy/admin/levels/{id}:
    patch:
      operationId: taxonomyAdminUpdateLevel
      responses:
        "200": { description: Level updated }
  /api/v1/taxonomy/admin/subjects:
    post:
      operationId: taxonomyAdminCreateSubject
      responses:
        "201": { description: Subject created with optional same-path active level }
  /api/v1/taxonomy/admin/subjects/{id}:
    patch:
      operationId: taxonomyAdminUpdateSubject
      responses:
        "200": { description: Subject updated }
  /api/v1/taxonomy/admin/skills:
    post:
      operationId: taxonomyAdminCreateSkill
      responses:
        "201": { description: Main/sub skill created with hierarchy validation }
  /api/v1/taxonomy/admin/skills/{id}:
    patch:
      operationId: taxonomyAdminUpdateSkill
      responses:
        "200": { description: Skill updated without changing stable code/kind/subject }

  /api/v1/questions:
    get:
      operationId: questionBankStaffList
      description: >
        Bounded staff Question Bank list. Default limit 80, maximum 100. Teacher access
        is forcibly scoped to owned/assigned questions and canonical active Content trainer
        path/subject scope. Exact coverage counts are not
        computed on this normal list path.
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 80 } }
        - { in: query, name: search, schema: { type: string, maxLength: 200 } }
        - { in: query, name: pathId, schema: { type: string } }
        - { in: query, name: subjectId, schema: { type: string } }
        - { in: query, name: mainSkillId, schema: { type: string } }
        - { in: query, name: skillId, schema: { type: string }, description: Repeatable skill filter; any matching skill qualifies. }
        - { in: query, name: linked, schema: { type: boolean } }
        - { in: query, name: difficulty, schema: { type: string } }
        - { in: query, name: type, schema: { type: string, enum: [mcq, true_false, essay] } }
        - { in: query, name: examType, schema: { type: string } }
        - { in: query, name: source, schema: { type: string } }
        - { in: query, name: year, schema: { type: integer } }
        - { in: query, name: workflowStatus, schema: { type: string, enum: [draft, pending_review, approved, rejected, archived] } }
        - { in: query, name: withVideo, schema: { type: boolean } }
        - { in: query, name: withExplanation, schema: { type: boolean } }
      responses:
        "200": { description: Bounded staff summary page with hasMore }
        "400": { description: Invalid filter or pagination }
        "401": { description: Authentication required }
        "403": { description: Staff role required }
    post:
      operationId: questionBankCreate
      description: >
        Create a stable question identity with version 1. Staff-only and CSRF-protected.
        Platform trainers may author only inside canonical active Content trainer scope;
        admin assignment to a trainer is rejected outside that trainer scope.
        A question may be text-only, image-only, or text+image. Image bytes are never sent
        through this endpoint; media is referenced by asset ID. AI-readable metadata stays
        server-side in the staff version payload.
      responses:
        "201": { description: Draft question created }
        "400": { description: Invalid question/version payload }
        "403": { description: Staff role or CSRF denied }
        "409": { description: Question code, taxonomy, asset, or hierarchy conflict }

  /api/v1/questions/coverage:
    get:
      operationId: questionBankCoverage
      description: >
        Separate filtered coverage/count endpoint so normal list reads stay bounded.
        Questions linked to multiple skills count once in Questions Total and once in each
        relevant per-skill count. Skill coverage rows are independently paginated to max 100.
      parameters:
        - { in: query, name: skillPage, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: skillLimit, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
      responses:
        "200": { description: Scoped aggregate and paginated per-skill coverage }
        "400": { description: Invalid filter or pagination }
        "401": { description: Authentication required }
        "403": { description: Staff role required }

  /api/v1/questions/import-batches:
    post:
      operationId: questionBankImportBatchV2
      description: >
        Platform-admin-only V2 quantitative question import. dryRun defaults to true.
        A write is accepted only after the server has recorded a successful matching durable PostgreSQL preflight for the exact normalized manifest. Maximum 100 items. Image bytes must already be uploaded
        and verified by Media/R2; this endpoint accepts metadata/asset IDs only.
      responses:
        "200": { description: Dry-run PASS report }
        "201": { description: Draft-only batch imported }
        "400": { description: Invalid batch/item/canonical source identity }
        "403": { description: Platform admin or CSRF denied }
        "409": { description: Existing identity/hash conflict or matching dry-run required }

  /api/v1/questions/import-batches/{batchId}:
    get:
      operationId: questionBankImportBatchStatus
      description: Platform-admin import report and current question workflow states.
      responses:
        "200": { description: Durable import batch report }
        "400": { description: Invalid batch ID }
        "403": { description: Platform admin required }
        "404": { description: Import batch not found }

  /api/v1/questions/import-batches/{batchId}/rollback:
    post:
      operationId: questionBankRollbackImportBatch
      description: >
        Archive-only rollback. The entire batch must still be draft. Question rows,
        stable IDs, provenance and history are retained rather than hard-deleted.
      responses:
        "200": { description: Batch rolled back by archiving imported drafts }
        "400": { description: Invalid batch ID }
        "403": { description: Platform admin or CSRF denied }
        "404": { description: Import batch not found }
        "409": { description: Batch contains non-draft questions or was already rolled back }

  /api/v1/questions/{id}:
    get:
      operationId: questionBankLearnerGet
      description: >
        Approved learner-safe question projection. Does not expose correctOptionIndex,
        explanation, hint, solvingStrategy, sourceMeta, full aiContext, voiceExplanation,
        reviewer notes, or approval internals.
      responses:
        "200": { description: Approved learner-safe question }
        "401": { description: Authentication required }
        "404": { description: Question unavailable or not approved }

  /api/v1/questions/{id}/staff:
    get:
      operationId: questionBankStaffGet
      description: Staff-authorized current version including workflow/private authoring metadata.
      responses:
        "200": { description: Staff question projection }
        "401": { description: Authentication required }
        "403": { description: Edit scope denied }
        "404": { description: Question not found }

  /api/v1/questions/{id}/versions:
    post:
      operationId: questionBankAppendVersion
      description: >
        Append an immutable material revision using optimistic expectedCurrentVersion.
        Approved/archived questions are not silently edited in place.
      responses:
        "200": { description: New current version appended }
        "400": { description: Invalid version payload }
        "403": { description: Edit scope or CSRF denied }
        "409": { description: Version, taxonomy, asset, or workflow conflict }

  /api/v1/questions/{id}/workflow:
    patch:
      operationId: questionBankSetWorkflow
      description: >
        Lifecycle transition for draft/pending_review/approved/rejected/archived using
        optimistic expectedCurrentVersion. Approval requires publishable answer metadata.
      responses:
        "200": { description: Workflow state updated }
        "400": { description: Invalid workflow payload }
        "403": { description: Role/scope or CSRF denied }
        "404": { description: Question not found }
        "409": { description: Invalid workflow or version conflict }

  /api/v1/media/uploads/presign:
    post:
      operationId: mediaPresignUpload
      description: >
        Staff-only CSRF-protected authorization for direct R2 upload. The Go API receives
        metadata only, never image/audio bytes. Supported question images are JPEG/PNG/WebP.
        Verified SHA-256 hashes are deduplicated.
      responses:
        "200": { description: Existing verified asset or short-lived signed PUT target }
        "400": { description: Invalid purpose, MIME, size, question code, or SHA-256 }
        "401": { description: Authentication required }
        "403": { description: Staff role or CSRF denied }
        "409": { description: Existing hash metadata conflicts }
        "503": { description: R2 provider not configured or unavailable }

  /api/v1/media/uploads/{id}/complete:
    post:
      operationId: mediaCompleteUpload
      description: >
        Verify the uploaded R2 object with authenticated HEAD. Size, MIME and signed
        x-amz-meta-sha256 must match the reserved asset before it becomes active.
      responses:
        "200": { description: Verified active asset }
        "401": { description: Authentication required }
        "403": { description: Asset ownership/admin scope or CSRF denied }
        "404": { description: Asset not found }
        "409": { description: R2 object missing or metadata verification failed }
        "503": { description: R2 provider unavailable }

  /api/v1/media/assets/{id}:
    get:
      operationId: mediaGetAsset
      description: >
        Authenticated asset metadata lookup. Active assets are readable by authenticated
        consumers; pending assets remain restricted to their creator/platform admin.
      responses:
        "200": { description: Asset metadata and CDN/public URL }
        "401": { description: Authentication required }
        "404": { description: Asset not found or not visible }


  /health/live:
    get:
      operationId: healthLive
      responses:
        "200": { description: Process is alive }
  /health/ready:
    get:
      operationId: healthReady
      responses:
        "200": { description: Core dependencies are reachable }
        "503": { description: Dependency unavailable }

  /api/v1/schools/context:
    get:
      operationId: organizationsSchoolContexts
      responses:
        "200": { description: Canonical active school contexts for the authenticated user }
        "401": { description: Authentication required }

  /api/v1/parents/authority:
    get:
      operationId: organizationsParentAuthority
      description: >
        Canonical Organizations-owned parent-to-student authority projection.
        Returns identifiers and relationship scope only; student profile/progress/reporting
        data remains owned by Identity/Reporting/Learning.
      responses:
        "200": { description: Active canonical parent-to-student relationships }
        "401": { description: Authentication required }
        "403": { description: Parent role required }

  /api/v1/schools/teacher-workspace:
    get:
      operationId: organizationsTeacherWorkspace
      description: >
        Organizations-owned structural workspace for an authenticated school teacher.
        Returns only active school/class/subject assignments and aggregate student counts.
        Entitlements, assessments, realtime state, reporting data, and trainer scope remain
        owned by their respective domains.
      responses:
        "200": { description: Scoped teacher school assignments }
        "401": { description: Authentication required }
        "403": { description: Teacher role required }

  /api/v1/schools:
    get:
      operationId: organizationsListSchools
      parameters:
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: search, schema: { type: string, maxLength: 120 } }
        - { in: query, name: status, schema: { type: string, enum: [active, suspended, archived] } }
      responses:
        "200": { description: Paginated schools visible to the authenticated organization scope }
        "401": { description: Authentication required }
        "403": { description: Organization role or scope denied }
    post:
      operationId: organizationsCreateSchool
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                code: { type: string, maxLength: 64 }
                name: { type: string, minLength: 1, maxLength: 160 }
                metadata: { type: object }
      responses:
        "201": { description: School created }
        "400": { description: Invalid request }
        "401": { description: Authentication required }
        "403": { description: Platform admin role and valid CSRF required }
        "409": { description: School code or normalized school identity conflicts }

  /api/v1/schools/{schoolId}:
    get:
      operationId: organizationsGetSchool
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
      responses:
        "200": { description: School visible to current scope }
        "401": { description: Authentication required }
        "403": { description: School scope denied }
        "404": { description: School not found }
    patch:
      operationId: organizationsUpdateSchool
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 160 }
                status: { type: string, enum: [active, suspended] }
                metadata: { type: object }
      responses:
        "200": { description: School updated }
        "400": { description: Invalid patch }
        "401": { description: Authentication required }
        "403": { description: School-management scope or CSRF denied }
        "404": { description: School not found }
        "409": { description: School update conflicts }
    delete:
      operationId: organizationsArchiveSchool
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "200": { description: School archived; canonical academic/audit records are retained }
        "401": { description: Authentication required }
        "403": { description: School-management scope or CSRF denied }
        "404": { description: School not found }

  /api/v1/schools/{schoolId}/classes:
    get:
      operationId: organizationsListClasses
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: search, schema: { type: string, maxLength: 120 } }
        - { in: query, name: status, schema: { type: string, enum: [active, archived] } }
      responses:
        "200": { description: Paginated classes visible inside the school scope }
        "401": { description: Authentication required }
        "403": { description: School scope denied }
    post:
      operationId: organizationsCreateClass
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                code: { type: string, maxLength: 64 }
                name: { type: string, minLength: 1, maxLength: 160 }
                metadata: { type: object }
      responses:
        "201": { description: Class created }
        "400": { description: Invalid request }
        "401": { description: Authentication required }
        "403": { description: Class-management capability or CSRF denied }
        "409": { description: Class code/name conflicts inside the school }

  /api/v1/schools/{schoolId}/classes/{classId}:
    patch:
      operationId: organizationsUpdateClass
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - { in: path, name: classId, required: true, schema: { type: string } }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 160 }
                status: { type: string, enum: [active] }
                metadata: { type: object }
      responses:
        "200": { description: Class updated }
        "400": { description: Invalid patch }
        "401": { description: Authentication required }
        "403": { description: Class-management capability or CSRF denied }
        "404": { description: Class not found in school }
        "409": { description: Class update conflicts }
    delete:
      operationId: organizationsArchiveClass
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - { in: path, name: classId, required: true, schema: { type: string } }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        "200": { description: Class archived; roster/history remain relational records }
        "401": { description: Authentication required }
        "403": { description: Class-management capability or CSRF denied }
        "404": { description: Class not found in school }

  /api/v1/schools/{schoolId}/roster:
    get:
      operationId: organizationsSchoolRoster
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: search, schema: { type: string, maxLength: 120 } }
        - { in: query, name: role, schema: { type: string, enum: [student, teacher, supervisor, school_admin, parent] } }
        - { in: query, name: classId, schema: { type: string } }
        - { in: query, name: isActive, schema: { type: boolean } }
      responses:
        "200": { description: Bounded school roster; teacher and school-director reads are constrained by role/capability policy }
        "400": { description: Invalid filter }
        "401": { description: Authentication required }
        "403": { description: School/role/class scope denied }

  /api/v1/schools/{schoolId}/memberships:
    put:
      operationId: organizationsUpsertMembership
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId, role]
              properties:
                userId: { type: string }
                role: { type: string, enum: [student, teacher, supervisor, parent] }
                status: { type: string, enum: [active, suspended, graduated, revoked], default: active }
      responses:
        "200": { description: School membership created or updated }
        "400": { description: Invalid membership input }
        "401": { description: Authentication required }
        "403": { description: Platform admin role or CSRF denied }
        "404": { description: School/user/role relationship target not found }

  /api/v1/schools/{schoolId}/directors:
    get:
      operationId: organizationsListDirectors
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: status, schema: { type: string, enum: [active, suspended, graduated, revoked] } }
      responses:
        "200": { description: Paginated school director delegations plus supported/default permission catalog }
        "401": { description: Authentication required }
        "403": { description: Platform admin role required }

  /api/v1/schools/{schoolId}/directors/{userId}:
    put:
      operationId: organizationsUpsertDirector
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - { in: path, name: userId, required: true, schema: { type: string } }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                status: { type: string, enum: [active, revoked], default: active }
                permissions:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
                    enum:
                      - SCHOOL_OVERVIEW_VIEW
                      - SCHOOL_REPORTS_AGGREGATE_VIEW
                      - SCHOOL_STUDENTS_VIEW
                      - SCHOOL_STUDENTS_ADD
                      - SCHOOL_STUDENTS_MOVE_CLASS
                      - SCHOOL_STUDENTS_UPDATE_BASIC
                      - SCHOOL_STUDENTS_DEACTIVATE
                      - SCHOOL_CLASSES_MANAGE
                      - SCHOOL_TEACHERS_ASSIGN
                      - SCHOOL_REPORTS_DETAILED_VIEW
                      - SCHOOL_REPORTS_EXPORT
                      - SCHOOL_ASSESSMENTS_MANAGE
                      - SCHOOL_SMART_CLASSROOM_VIEW
                      - SCHOOL_INTERVENTIONS_VIEW
                      - SCHOOL_INTERVENTIONS_MANAGE
                      - SCHOOL_STUDENTS_TRANSFER_SCHOOL
              description: Omitting permissions uses the legacy default set; an explicit empty array grants no director permissions.
      responses:
        "200": { description: Director delegation updated transactionally with permissions and audit }
        "400": { description: Invalid status or permission }
        "401": { description: Authentication required }
        "403": { description: Platform admin role or CSRF denied }
        "404": { description: School or school_admin user not found }

  /api/v1/schools/{schoolId}/assignments:
    get:
      operationId: organizationsListTeachingAssignments
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { in: query, name: teacherId, schema: { type: string } }
        - { in: query, name: classId, schema: { type: string } }
        - { in: query, name: subjectId, schema: { type: string, description: Empty value selects subject-agnostic assignments } }
        - { in: query, name: status, schema: { type: string, enum: [active, ended, revoked] } }
      responses:
        "200": { description: Bounded teaching-assignment directory; teachers are forced to their own assignments }
        "400": { description: Invalid filter }
        "401": { description: Authentication required }
        "403": { description: Role or SCHOOL_TEACHERS_ASSIGN permission denied }
    put:
      operationId: organizationsUpsertTeachingAssignment
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [teacherId, classId]
              properties:
                teacherId: { type: string }
                classId: { type: string }
                subjectId:
                  type: string
                  default: ""
                  description: Empty keeps legacy subject-agnostic class assignment behavior.
                status: { type: string, enum: [active, ended, revoked], default: active }
      responses:
        "200": { description: Teaching assignment created or updated transactionally }
        "400": { description: Invalid assignment input }
        "401": { description: Authentication required }
        "403": { description: Platform admin or SCHOOL_TEACHERS_ASSIGN permission and CSRF required }
        "404": { description: School/class/teacher/subject relationship target not found }

  /api/school-access/context:
    get:
      deprecated: true
      operationId: legacySchoolAccessContext
      responses:
        "200": { description: Legacy-compatible school context response backed by canonical Organizations data }
        "401": { description: Authentication required }

  /api/school-access/memberships:
    put:
      deprecated: true
      operationId: legacySchoolAccessUpsertMembership
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [schoolId, userId, role]
              properties:
                schoolId: { type: string }
                userId: { type: string }
                role: { type: string, enum: [student, teacher, supervisor, parent] }
                status: { type: string, enum: [active, inactive], default: active }
      responses:
        "200": { description: Legacy membership shape; inactive maps to canonical revoked }
        "400": { description: Invalid request }
        "401": { description: Authentication required }
        "403": { description: Platform admin role or CSRF denied }

  /api/school-access/directors/{schoolId}:
    get:
      deprecated: true
      operationId: legacySchoolAccessDirectors
      parameters:
        - { in: path, name: schoolId, required: true, schema: { type: string } }
      responses:
        "200": { description: Legacy flat director delegation shape backed by canonical memberships/permissions }
        "401": { description: Authentication required }
        "403": { description: Platform admin role required }

