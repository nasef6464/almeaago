                      - SCHOOL_SMART_CLASSROOM_VIEW
                      - SCHOOL_INTERVENTIONS_VIEW
                      - SCHOOL_INTERVENTIONS_MANAGE
                      - SCHOOL_STUDENTS_TRANSFER_SCHOOL
              description: Omitting permissions uses the legacy default set; an explicit empty array grants no director permissions.
