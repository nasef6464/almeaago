name: Assessment attempt gofmt once
on:
  push:
    branches: [feat/assessment-attempt-core]
    paths: [".github/workflows/assessment-attempt-gofmt-once.yml"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: {ref: feat/assessment-attempt-core}
      - uses: actions/setup-go@v7
        with: {go-version-file: go.mod}
      - run: gofmt -w internal/assessment cmd/api/main.go internal/platform/httpserver/server.go
      - run: |
          rm .github/workflows/assessment-attempt-gofmt-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/assessment cmd/api/main.go internal/platform/httpserver/server.go .github/workflows/assessment-attempt-gofmt-once.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(assessment): gofmt attempt core"
          git push
