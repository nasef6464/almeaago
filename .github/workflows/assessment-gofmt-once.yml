name: Assessment gofmt once

on:
  push:
    branches:
      - feat/assessment-definition-api
    paths:
      - ".github/workflows/assessment-gofmt-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/assessment-definition-api
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format assessment Go files
        run: gofmt -w internal/assessment
      - name: Commit formatting and remove one-shot workflow
        run: |
          rm .github/workflows/assessment-gofmt-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/assessment .github/workflows/assessment-gofmt-once.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style(assessment): gofmt implementation"
          git push
