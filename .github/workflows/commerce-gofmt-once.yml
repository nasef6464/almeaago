name: Commerce Gofmt Once
on:
  push:
    branches: [feat/commerce-access-codes-seats]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: feat/commerce-access-codes-seats }
      - uses: actions/setup-go@v5
        with: { go-version: "1.27.1", cache: false }
      - name: Format and remove one-shot workflow
        shell: bash
        run: |
          gofmt -w internal/commerce cmd/api/main.go
          rm .github/workflows/commerce-gofmt-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/commerce cmd/api/main.go .github/workflows/commerce-gofmt-once.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(commerce): apply gofmt to access slice"
          git push
