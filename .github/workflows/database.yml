name: Database CI
on:
  pull_request:
    paths: ["migrations/**",".github/workflows/database.yml"]
  push:
    branches: [main]
    paths: ["migrations/**",".github/workflows/database.yml"]
  workflow_dispatch:
concurrency:
  group: database-ci-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: almeaa, POSTGRES_PASSWORD: almeaa, POSTGRES_DB: almeaa }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U almeaa -d almeaa"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env: { PGPASSWORD: almeaa }
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Apply migrations
        run: |
          psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f migrations/000001_platform_foundation.up.sql
          psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f migrations/000002_organization_access_foundation.up.sql
          psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f migrations/000003_identity_auth.up.sql
          psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f migrations/000004_identity_recovery.up.sql
          psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f migrations/000005_identity_providers.up.sql
          psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f migrations/000006_otp_rate_limit_index.up.sql
          psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f migrations/000007_identity_admin_audit.up.sql
          psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f migrations/000008_organizations_core.up.sql
          psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f migrations/000009_school_contracts.up.sql
      - name: Verify platform constraints
        run: |
          psql -h 127.0.0.1 -U almeaa -d almeaa -Atc "select to_regclass('public.user_roles') is not null" | grep -qx t
          psql -h 127.0.0.1 -U almeaa -d almeaa -Atc "select to_regclass('public.auth_provider_identities') is not null" | grep -qx t
          psql -h 127.0.0.1 -U almeaa -d almeaa -Atc "select to_regclass('public.auth_otp_challenges') is not null" | grep -qx t
          psql -h 127.0.0.1 -U almeaa -d almeaa -Atc "select count(*) from pg_indexes where tablename='auth_otp_challenges' and indexname='auth_otp_challenges_phone_history_idx'" | grep -qx 1
          psql -h 127.0.0.1 -U almeaa -d almeaa -Atc "select count(*) from pg_indexes where tablename='auth_otp_challenges' and indexname='auth_otp_challenges_phone_active_idx'" | grep -qx 0
          psql -h 127.0.0.1 -U almeaa -d almeaa -Atc "select to_regclass('public.audit_logs') is not null" | grep -qx t
          psql -h 127.0.0.1 -U almeaa -d almeaa -Atc "select count(*) from pg_indexes where tablename='users' and indexname='users_name_trgm_idx'" | grep -qx 1
          psql -h 127.0.0.1 -U almeaa -d almeaa -Atc "select count(*) from pg_indexes where tablename='users' and indexname='users_email_trgm_idx'" | grep -qx 1
          psql -h 127.0.0.1 -U almeaa -d almeaa -Atc "select count(*) from pg_indexes where tablename='school_memberships' and indexname='school_memberships_user_active_idx'" | grep -qx 1
          psql -h 127.0.0.1 -U almeaa -d almeaa -Atc "select to_regclass('public.school_supervisor_scopes') is not null" | grep -qx t
          psql -h 127.0.0.1 -U almeaa -d almeaa -Atc "select to_regclass('public.school_membership_permissions') is not null" | grep -qx t
          psql -h 127.0.0.1 -U almeaa -d almeaa -Atc "select count(*) from information_schema.columns where table_name='schools' and column_name='metadata'" | grep -qx 1
          psql -h 127.0.0.1 -U almeaa -d almeaa -Atc "select count(*) from pg_indexes where tablename='classes' and indexname='classes_school_status_created_idx'" | grep -qx 1
          psql -h 127.0.0.1 -U almeaa -d almeaa -Atc "select count(*) from pg_indexes where tablename='schools' and indexname='schools_name_trgm_idx'" | grep -qx 1
          psql -h 127.0.0.1 -U almeaa -d almeaa -Atc "select count(*) from pg_indexes where tablename='classes' and indexname='classes_name_trgm_idx'" | grep -qx 1
          psql -h 127.0.0.1 -U almeaa -d almeaa -Atc "select to_regclass('public.school_contracts') is not null" | grep -qx t
          psql -h 127.0.0.1 -U almeaa -d almeaa -Atc "select to_regclass('public.school_contract_modules') is not null" | grep -qx t
          psql -h 127.0.0.1 -U almeaa -d almeaa -Atc "select count(*) from pg_indexes where tablename='school_contracts' and indexname='school_contracts_status_validity_idx'" | grep -qx 1
          psql -h 127.0.0.1 -U almeaa -d almeaa -Atc "select count(*) from pg_indexes where tablename='school_contract_modules' and indexname='school_contract_modules_module_idx'" | grep -qx 1
      - name: Verify school contract entitlement semantics
        run: |
          psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO schools (code, name, status)
          VALUES ('CI-CONTRACT-SCHOOL', 'CI Contract School', 'active');

          INSERT INTO school_contracts (school_id, status, valid_from, valid_until)
          SELECT id, 'active', now() - interval '1 day', now() + interval '1 day'
          FROM schools
          WHERE code = 'CI-CONTRACT-SCHOOL';

          INSERT INTO school_contract_modules (contract_id, module)
          SELECT sc.id, 'SCHOOL_CORE'
          FROM school_contracts sc
          JOIN schools s ON s.id = sc.school_id
          WHERE s.code = 'CI-CONTRACT-SCHOOL';

          DO $
          DECLARE
            school_uuid uuid;
            contract_uuid uuid;
            allowed boolean;
          BEGIN
            SELECT id INTO school_uuid
            FROM schools
            WHERE code = 'CI-CONTRACT-SCHOOL';

            SELECT id INTO contract_uuid
            FROM school_contracts
            WHERE school_id = school_uuid;

            SELECT EXISTS (
              SELECT 1
              FROM school_contracts sc
              JOIN school_contract_modules scm ON scm.contract_id = sc.id
              WHERE sc.school_id = school_uuid
                AND sc.status = 'active'
                AND (sc.valid_from IS NULL OR sc.valid_from <= now())
                AND (sc.valid_until IS NULL OR sc.valid_until >= now())
                AND scm.module = 'SCHOOL_CORE'
            ) INTO allowed;

            IF NOT allowed THEN
              RAISE EXCEPTION 'active SCHOOL_CORE contract must allow entitlement';
            END IF;

            UPDATE school_contracts
            SET valid_until = now() - interval '2 days',
                valid_from = now() - interval '3 days'
            WHERE id = contract_uuid;

            SELECT EXISTS (
              SELECT 1
              FROM school_contracts sc
              JOIN school_contract_modules scm ON scm.contract_id = sc.id
              WHERE sc.school_id = school_uuid
                AND sc.status = 'active'
                AND (sc.valid_from IS NULL OR sc.valid_from <= now())
                AND (sc.valid_until IS NULL OR sc.valid_until >= now())
                AND scm.module = 'SCHOOL_CORE'
            ) INTO allowed;

            IF allowed THEN
              RAISE EXCEPTION 'expired SCHOOL_CORE contract must deny entitlement';
            END IF;
          END $;
          SQL

      - name: Roll back and re-apply
        run: |
          psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f migrations/000009_school_contracts.down.sql
          psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f migrations/000008_organizations_core.down.sql
          psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f migrations/000007_identity_admin_audit.down.sql
          psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f migrations/000006_otp_rate_limit_index.down.sql
          psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f migrations/000005_identity_providers.down.sql
          psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f migrations/000004_identity_recovery.down.sql
          psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f migrations/000003_identity_auth.down.sql
          psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f migrations/000002_organization_access_foundation.down.sql
          psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f migrations/000001_platform_foundation.down.sql
          psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f migrations/000001_platform_foundation.up.sql
          psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f migrations/000002_organization_access_foundation.up.sql
          psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f migrations/000003_identity_auth.up.sql
          psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f migrations/000004_identity_recovery.up.sql
          psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f migrations/000005_identity_providers.up.sql
          psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f migrations/000006_otp_rate_limit_index.up.sql
          psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f migrations/000007_identity_admin_audit.up.sql
          psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f migrations/000008_organizations_core.up.sql
          psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f migrations/000009_school_contracts.up.sql
