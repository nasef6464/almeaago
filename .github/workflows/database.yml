name: Database CI
on:
  pull_request:
    paths: ["migrations/**",".github/workflows/database.yml"]
  push:
    branches: [main]
    paths: ["migrations/**",".github/workflows/database.yml"]
  workflow_dispatch:
concurrency:
  group: database-ci-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: almeaa, POSTGRES_PASSWORD: almeaa, POSTGRES_DB: almeaa }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U almeaa -d almeaa"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env: { PGPASSWORD: almeaa }
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Apply every migration
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find migrations -maxdepth 1 -type f -name '*.up.sql' | sort)
          test "${#migrations[@]}" -gt 0
          for file in "${migrations[@]}"; do
            echo "::group::apply $file"
            psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f "$file"
            echo "::endgroup::"
          done

      - name: Verify current schema constraints
        shell: bash
        run: |
          set -euo pipefail
          check() {
            local sql="$1"
            psql -h 127.0.0.1 -U almeaa -d almeaa -Atc "$sql" | grep -qx t
          }

          check "select to_regclass('public.user_roles') is not null"
          check "select to_regclass('public.auth_provider_identities') is not null"
          check "select to_regclass('public.audit_logs') is not null"
          check "select to_regclass('public.school_supervisor_scopes') is not null"
          check "select to_regclass('public.levels') is not null"
          check "select to_regclass('public.question_import_batches') is not null"
          check "select to_regclass('public.courses') is not null"
          check "select to_regclass('public.course_modules') is not null"
          check "select to_regclass('public.lessons') is not null"
          check "select to_regclass('public.library_items') is not null"
          check "select to_regclass('public.topic_skill_links') is not null"
          check "select exists(select 1 from information_schema.columns where table_name='foundation_topics' and column_name='path_id')"
          check "select exists(select 1 from pg_indexes where tablename='assets' and indexname='assets_sha256_live_unique_idx')"
          check "select exists(select 1 from pg_indexes where tablename='questions' and indexname='questions_source_item_unique_idx')"
          check "select exists(select 1 from pg_indexes where tablename='courses' and indexname='courses_taxonomy_workflow_idx')"
          check "select to_regclass('public.content_trainer_path_scopes') is not null"
          check "select to_regclass('public.content_trainer_subject_scopes') is not null"
          check "select exists(select 1 from information_schema.columns where table_name='courses' and column_name='is_published')"
          check "select exists(select 1 from information_schema.columns where table_name='courses' and column_name='published_by')"
          check "select exists(select 1 from information_schema.columns where table_name='courses' and column_name='published_at')"
          check "select exists(select 1 from pg_constraint where conname='courses_publication_requires_approval')"
          check "select exists(select 1 from pg_indexes where tablename='courses' and indexname='courses_published_catalog_idx')"
          check "select to_regclass('public.assessments') is not null"
          check "select to_regclass('public.assessment_versions') is not null"
          check "select to_regclass('public.assessment_version_questions') is not null"
          check "select to_regclass('public.assessment_assignments') is not null"
          check "select to_regclass('public.assessment_sessions') is not null"
          check "select to_regclass('public.assessment_public_attempts') is not null"
          check "select to_regclass('public.assessment_public_answers') is not null"
          check "select to_regclass('public.assessment_public_results') is not null"
          check "select exists(select 1 from information_schema.columns where table_name='assessment_sessions' and column_name='max_submissions')"
          check "select exists(select 1 from pg_indexes where tablename='assessment_public_attempts' and indexname='assessment_public_attempts_participant_idx')"
          check "select to_regclass('public.assessment_attempts') is not null"
          check "select to_regclass('public.assessment_answers') is not null"
          check "select to_regclass('public.assessment_results') is not null"
          check "select exists(select 1 from pg_indexes where tablename='assessment_attempts' and indexname='assessment_attempts_student_recent_idx')"
          check "select exists(select 1 from pg_indexes where tablename='assessment_results' and indexname='assessment_results_student_recent_idx')"
          check "select exists(select 1 from information_schema.columns where table_name='assessment_versions' and column_name='access_type' and column_default like '%free%')"
          check "select exists(select 1 from information_schema.columns where table_name='assessment_learning_placements' and column_name='access_type' and column_default like '%inherit%')"
          check "select to_regclass('public.mastery_evidence') is not null"
          check "select to_regclass('public.mastery_evidence_skills') is not null"
          check "select to_regclass('public.skill_progress') is not null"
          check "select to_regclass('public.review_cards') is not null"
          check "select to_regclass('public.review_card_skills') is not null"
          check "select exists(select 1 from pg_indexes where schemaname='public' and tablename='mastery_evidence' and indexdef ~ 'UNIQUE.*\\(evidence_type, source_attempt_id, question_id\\)')"
          check "select exists(select 1 from pg_indexes where tablename='skill_progress' and indexname='skill_progress_student_mastery_idx')"
          check "select exists(select 1 from pg_indexes where tablename='review_cards' and indexname='review_cards_student_due_idx')"
          check "select to_regclass('public.mastery_goals') is not null"
          check "select exists(select 1 from pg_indexes where tablename='mastery_goals' and indexname='mastery_goals_student_scope_idx')"
          check "select exists(select 1 from pg_constraint where conname='mastery_goals_path_target_shape')"
          check "select to_regclass('public.study_plans') is not null"
          check "select to_regclass('public.study_plan_items') is not null"
          check "select exists(select 1 from pg_indexes where tablename='study_plans' and indexname='study_plans_student_path_status_idx')"
          check "select exists(select 1 from pg_constraint where conname='study_plan_items_target_shape')"
          check "select to_regclass('public.commerce_products') is not null"
          check "select to_regclass('public.commerce_packages') is not null"
          check "select to_regclass('public.commerce_package_items') is not null"
          check "select to_regclass('public.commerce_entitlements') is not null"
          check "select exists(select 1 from pg_indexes where tablename='commerce_products' and indexname='commerce_products_course_unique_idx')"
          check "select exists(select 1 from pg_indexes where tablename='commerce_entitlements' and indexname='commerce_entitlements_user_active_idx')"
          check "select exists(select 1 from pg_constraint where conname='commerce_package_items_target_shape')"
          check "select to_regclass('public.commerce_access_codes') is not null"
          check "select to_regclass('public.commerce_access_code_redemptions') is not null"
          check "select to_regclass('public.commerce_school_seat_assignments') is not null"
          check "select exists(select 1 from pg_indexes where tablename='commerce_school_seat_assignments' and indexname='commerce_school_seat_active_user_idx')"
          check "select exists(select 1 from pg_constraint where conname='commerce_access_codes_window_check')"

      - name: Roll back every migration
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find migrations -maxdepth 1 -type f -name '*.down.sql' | sort -r)
          for file in "${migrations[@]}"; do
            echo "::group::rollback $file"
            psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f "$file"
            echo "::endgroup::"
          done
          test "$(psql -h 127.0.0.1 -U almeaa -d almeaa -Atc "select to_regclass('public.users') is null")" = "t"

      - name: Re-apply every migration
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t migrations < <(find migrations -maxdepth 1 -type f -name '*.up.sql' | sort)
          for file in "${migrations[@]}"; do
            echo "::group::reapply $file"
            psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f "$file"
            echo "::endgroup::"
          done
