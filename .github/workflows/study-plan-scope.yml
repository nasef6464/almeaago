name: Study Plan PostgreSQL Scope
on:
  pull_request:
    paths:
      - "internal/learning/repository/postgres/study_plan*"
      - ".github/workflows/study-plan-scope.yml"
  workflow_dispatch:
concurrency:
  group: study-plan-scope-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }
jobs:
  study-plan-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: almeaa
          POSTGRES_PASSWORD: almeaa
          POSTGRES_DB: almeaa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U almeaa -d almeaa"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PGPASSWORD: almeaa
      DATABASE_URL: postgres://almeaa:almeaa@127.0.0.1:5432/almeaa?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Apply complete migrated schema
        shell: bash
        run: |
          set -euo pipefail
          for file in $(find migrations -maxdepth 1 -type f -name '*.up.sql' | sort); do
            psql -h 127.0.0.1 -U almeaa -d almeaa -v ON_ERROR_STOP=1 -f "$file" >/dev/null
          done
      - name: Verify student, path and status isolation on PostgreSQL
        run: go test ./internal/learning/repository/postgres -run '^TestStudyPlanListScopePostgres$' -count=1 -v
