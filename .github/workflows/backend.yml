name: Backend CI
on:
  pull_request:
    paths: ["cmd/**","internal/**","db/**","go.mod","go.sum","sqlc.yaml",".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["cmd/**","internal/**","db/**","go.mod","go.sum","sqlc.yaml",".github/workflows/backend.yml"]
  workflow_dispatch:
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.27.1", cache: false }
      - run: go mod download
      - name: Install pinned sqlc binary
        shell: bash
        run: |
          curl -fsSL "https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz" -o /tmp/sqlc.tar.gz
          tar -xzf /tmp/sqlc.tar.gz -C /tmp
          sudo install -m 0755 /tmp/sqlc /usr/local/bin/sqlc
          sqlc version
      - run: sqlc compile
      - name: Check gofmt
        shell: bash
        run: |
          unformatted="$(find cmd internal -type f -name '*.go' -print0 | xargs -0 gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
