name: Backend CI
on:
  pull_request:
    paths: ["cmd/**","internal/**","db/**","go.mod","go.sum","sqlc.yaml",".github/workflows/backend.yml"]
  push:
    branches: [main]
    paths: ["cmd/**","internal/**","db/**","go.mod","go.sum","sqlc.yaml",".github/workflows/backend.yml"]
  workflow_dispatch:
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.27.1", cache: false }
      - name: Verify module lock
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Install pinned sqlc binary
        shell: bash
        run: |
          curl -fsSL "https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz" -o /tmp/sqlc.tar.gz
          tar -xzf /tmp/sqlc.tar.gz -C /tmp
          sudo install -m 0755 /tmp/sqlc /usr/local/bin/sqlc
          sqlc version
      - run: sqlc compile
      - name: Check gofmt with per-file diagnostics
        shell: bash
        run: |
          status=0
          while IFS= read -r -d '' file; do
            tmp="$(mktemp)"
            if ! gofmt -d "$file" >"$tmp"; then
              echo "::error file=$file::gofmt could not parse this file"
              cat "$tmp"
              status=1
            elif [ -s "$tmp" ]; then
              echo "::error file=$file::file is not gofmt-formatted"
              cat "$tmp"
              status=1
            fi
            rm -f "$tmp"
          done < <(find cmd internal -type f -name '*.go' -print0)
          exit "$status"
      - run: go vet ./...
      - run: go test ./...
