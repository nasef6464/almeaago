name: Backend CI
on:
  pull_request:
    paths: ["cmd/**","internal/**","db/**","go.mod","go.sum","sqlc.yaml",".github/workflows/backend.yml","docs/**"]
  push:
    branches: [main]
    paths: ["cmd/**","internal/**","db/**","go.mod","go.sum","sqlc.yaml",".github/workflows/backend.yml","docs/**"]
  workflow_dispatch:
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: "1.27.1", cache: false }
      - name: Verify module lock
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Install pinned sqlc binary
        shell: bash
        run: |
          curl -fsSL "https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz" -o /tmp/sqlc.tar.gz
          tar -xzf /tmp/sqlc.tar.gz -C /tmp
          sudo install -m 0755 /tmp/sqlc /usr/local/bin/sqlc
          sqlc version
      - run: sqlc compile
      - name: Check gofmt
        id: gofmt
        shell: bash
        run: |
          status=0
          while IFS= read -r -d '' file; do
            if listed="$(gofmt -l "$file")"; then
              if [ -n "$listed" ]; then
                echo "::error file=$file::file is not gofmt-formatted"
                gofmt -d "$file" || true
                status=1
              fi
            else
              echo "::error file=$file::gofmt could not parse this file"
              status=1
            fi
          done < <(find cmd internal -type f -name '*.go' -print0)
          exit "$status"
      # Publish an exact, apply-ready formatting patch for the owning teams.
      # This does NOT modify the checkout, waive gofmt, or change CI failure.
      - name: Build gofmt remediation patch
        if: ${{ !cancelled() && steps.gofmt.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/almeaa-gofmt
          while IFS= read -r -d '' file; do
            if [ -n "$(gofmt -l "$file")" ]; then
              gofmt -w "$file"
            fi
          done < <(find cmd internal -type f -name '*.go' -print0)
          git diff --binary -- cmd internal > /tmp/almeaa-gofmt/format.patch
          test -s /tmp/almeaa-gofmt/format.patch
          git diff --name-only -- cmd internal > /tmp/almeaa-gofmt/changed-files.txt
      - name: Upload gofmt remediation patch
        if: ${{ !cancelled() && steps.gofmt.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: gofmt-remediation-patch
          path: /tmp/almeaa-gofmt/
          retention-days: 7
          if-no-files-found: error
      # Formatting failures must keep CI red, but should not hide independent
      # vet/test failures in unrelated packages during the 24h recovery.
      - name: Go vet all packages
        if: ${{ !cancelled() && steps.gofmt.outcome != 'cancelled' }}
        run: go vet ./...
      - name: Go test all packages
        if: ${{ !cancelled() && steps.gofmt.outcome != 'cancelled' }}
        run: go test ./...
