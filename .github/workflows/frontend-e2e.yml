name: Frontend E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend-e2e.yml"
      - "docs/**"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - ".github/workflows/frontend-e2e.yml"
      - "docs/**"

concurrency:
  group: frontend-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify local preinstalled Chromium fallback with a real E2E test
        if: matrix.shard == 1
        shell: bash
        run: |
          set -euo pipefail
          BROWSER_PATH="$(node -e 'console.log(require("@playwright/test").chromium.executablePath())')"
          test -x "$BROWSER_PATH"
          # Browser-fallback smoke: use a self-contained spec so the check proves Chromium works without a live API.
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$BROWSER_PATH" npm run e2e:local -- tests/e2e/auth-parity.spec.ts
      - name: Run Playwright shard ${{ matrix.shard }}/3
        run: npm run e2e -- --shard=${{ matrix.shard }}/3
      - name: Upload browser evidence (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-browser-evidence-shard-${{ matrix.shard }}
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
