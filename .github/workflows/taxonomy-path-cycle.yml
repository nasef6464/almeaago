name: Taxonomy Path Cycle PostgreSQL
on:
  pull_request:
    paths:
      - "internal/taxonomy/repository/postgres/**"
      - ".github/workflows/taxonomy-path-cycle.yml"
  workflow_dispatch:
permissions: { contents: read }
concurrency:
  group: taxonomy-path-cycle-${{ github.ref }}
  cancel-in-progress: true
jobs:
  taxonomy-path-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: almeaa
          POSTGRES_PASSWORD: almeaa
          POSTGRES_DB: almeaa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U almeaa -d almeaa"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://almeaa:almeaa@127.0.0.1:5432/almeaa?sslmode=disable
      TAXONOMY_PATH_DB_TEST: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: RED — original main permits descendant cycle (expected failure)
        shell: bash
        run: |
          set -euo pipefail
          red_dir=$(mktemp -d)
          trap 'rm -rf -- "$red_dir"' EXIT
          git show 98b0f6d9ad0bba031936d950d087c0bd3d19b7bb:internal/taxonomy/repository/postgres/mutations.go > "$red_dir/mutations.go"
          python3 - "$PWD" "$red_dir" <<'PY'
          import json, pathlib, sys
          root, temporary = map(pathlib.Path, sys.argv[1:])
          original = root / 'internal/taxonomy/repository/postgres/mutations.go'
          (temporary / 'overlay.json').write_text(json.dumps({'Replace': {str(original): str(temporary / 'mutations.go')}}))
          PY
          # Compile the historical implementation with its exact behavioral
          # regression, excluding newer tests for helpers absent in that commit.
          # The overlay leaves all current checkout files intact, even on error.
          if go test -overlay "$red_dir/overlay.json" \
            ./internal/taxonomy/repository/postgres/repository.go \
            ./internal/taxonomy/repository/postgres/mutations.go \
            ./internal/taxonomy/repository/postgres/public_visibility.go \
            ./internal/taxonomy/repository/postgres/skill_sections.go \
            ./internal/taxonomy/repository/postgres/path_parent_cycle_integration_test.go \
            -run TestAdminPathParentCyclePostgres -count=1 -v > "$red_dir/taxonomy-red.log" 2>&1; then
            cat "$red_dir/taxonomy-red.log"
            echo "::error::Original implementation unexpectedly passed the cycle regression"
            exit 1
          fi
          cat "$red_dir/taxonomy-red.log"
          grep -q 'descendant parent must conflict' "$red_dir/taxonomy-red.log"
      - name: GREEN — hierarchy and concurrent updates in isolated PostgreSQL schema
        run: go test ./internal/taxonomy/repository/postgres -run TestAdminPathParentCyclePostgres -count=1 -v
