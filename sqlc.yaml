version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "migrations/000001_platform_foundation.up.sql"
      - "migrations/000002_organization_access_foundation.up.sql"
      - "migrations/000003_identity_auth.up.sql"
      - "migrations/000004_identity_recovery.up.sql"
      - "migrations/000005_identity_providers.up.sql"
      - "migrations/000006_otp_rate_limit_index.up.sql"
      - "migrations/000007_identity_admin_audit.up.sql"
      - "migrations/000008_organizations_core.up.sql"
      - "migrations/000009_school_contracts.up.sql"
    queries: "db/queries"
    gen:
      go:
        package: "dbgen"
        out: "internal/platform/database/dbgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_db_tags: true
        emit_interface: true
        emit_empty_slices: true
